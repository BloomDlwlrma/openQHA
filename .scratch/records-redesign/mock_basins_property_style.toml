# MOCK, not written by any code yet (2026-09-15, records redesign, grilling round 1).
# ORCA .property.txt carried over to TOML:
#   $Block ... $End                      ->  [Block]
#   &KEY [&Type "Double", &Units "u"] v "doc"  ->  KEY = v   # Double, u: doc
#   &GeometryIndex n, &ListStatus        ->  [[Basin]] tables with basin_index (one table per basin)
#   $Calculation_Status first, STATUS "NORMAL TERMINATION" last-written
# Only what a later step reads is here; prose, provenance and diagnostics are in branchA.out.
# The comments come from one schema table in the writer, so every file carries the same ones.

[Calculation_Status]
PROGNAME = "openQHA branchA"          # String: the step that wrote this file
VERSION  = "0.9"                      # String: openQHA version
STATUS   = "NORMAL TERMINATION"       # String: the completion marker (absent or other while running)

[Calculation_Info]
QM9_INDEX          = "dsgdb9nsd_000035"   # String: the molecule
SMILES             = "CCC=O"              # String: declared in config
TAG                = "propanal"           # String: the tag this run was made under
ENGINE             = "MACE-OFF23_medium"  # String: the potential
WORKHORSE          = "gfn2"               # String: CREST sampling level
RUNTYPE            = "imtd-gc"            # String: CREST run type
OPTLEV             = "tight"              # String: CREST optimisation level
SHAKE              = 2                    # Integer: SHAKE on all bonds
TSTEP              = 5.0                  # Double, fs: CREST MD time step
HMASS              = 2.0                  # Double, amu: hydrogen mass in CREST MD
THREADS            = 4                    # Integer
FMAX               = 1.0e-4               # Double, eV/A: tightening convergence
DEDUP_RMSD         = 0.125                # Double, A: CREGEN three-fold threshold 1
DEDUP_ETHR         = 0.05                 # Double, kcal/mol: threshold 2
DEDUP_BTHR         = 0.01                 # Double, relative: threshold 3
HESSIAN_MODE       = "analytic"           # String
TEMPERATURE        = 298.15               # Double, K
SYMMETRY_TOLERANCE = 0.1                  # Double, A: sigma detection tolerance

[CREST_Run]
RETURNCODE          = 0        # Integer
TERMINATED_NORMALLY = true     # Boolean: crest.out carries its own terminal line
N_CONFORMERS        = 4        # Integer: what CREST reported (not a basin count)
SHAKE_USED          = 2        # Integer: which SHAKE actually ran (criterion 10)
USED_SHAKE_FALLBACK = false    # Boolean
WALL                = 224.2    # Double, s

[Census]
N_FRAMES_IN     = 5      # Integer: CREST conformers + pooled reference geometries
N_NOT_CONVERGED = 0      # Integer
N_GRAPH_CHANGED = 0      # Integer
N_BASINS        = 3      # Integer: after tightening and deduplication
BASIN_CONFORMER_IDS = [0, 1, 3]   # ArrayOfIntegers: which input frame each basin came from

[[Basin]]
basin_index  = 0
ENERGY       = -5259.1889563698605   # Double, eV: electronic energy after tightening
RELATIVE     = 0.0                   # Double, kcal/mol: above the lowest basin
SIGMA        = 1                     # Integer: symmetry number (declared in config)
G0           = 1                     # Integer: electronic degeneracy (declared in config)
N_IMAGINARY  = 0                     # Integer
LOWEST_FREQ  = 128.4485              # Double, cm^-1
G_MINUS_EEL  = 36.02523397086022     # Double, kcal/mol: harmonic G - E_el at TEMPERATURE (the ensemble report sums this)
A_MINUS_EEL  = 35.43274902103937     # Double, kcal/mol

[[Basin]]
basin_index  = 1
ENERGY       = -5259.152703422143
RELATIVE     = 0.8360128348498219
SIGMA        = 1
G0           = 1
N_IMAGINARY  = 0
LOWEST_FREQ  = 73.9852
G_MINUS_EEL  = 35.77002194687515
A_MINUS_EEL  = 35.1775369970543

[[Basin]]
basin_index  = 2
ENERGY       = -5259.152703421603
RELATIVE     = 0.8360128472870755
SIGMA        = 1
G0           = 1
N_IMAGINARY  = 0
LOWEST_FREQ  = 73.9755
G_MINUS_EEL  = 35.77002194687515
A_MINUS_EEL  = 35.1775369970543

[Criteria]
N_PASSED = 9      # Integer: of N_TOTAL (each verdict and its detail line is in branchA.out)
N_TOTAL  = 9      # Integer
ALL_PASSED = true # Boolean: what the batch driver reads
