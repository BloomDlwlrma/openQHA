# openQHA -- Species scope: the F0-F7 gates. Read by openqha/filters.py.
#
# Split out of configs/openqha.yaml on 2026-09-04: that file
# now holds ONLY global configuration and the `include:` index. This is a
# MOVE, not a copy -- openqha/config.py raises if two files define the same
# key -- and it was moved by byte range, so every comment and every measured
# number came with it verbatim.
# ======================================================================

# --------------------------------------------------------------------------------------
# Species scope -- rewritten clause by clause from stage 1's gates F0-F6
# --------------------------------------------------------------------------------------
# **Only neutral molecules, with no unpaired electrons and a net charge of 0.** Stage 1's docs/02 section 4.1 split that into gates that can be counted
# separately; this is a REWRITE of each, not a reference to it.
# The order is normative and short-circuits: the first gate that fails decides, so every
# rejection is attributed to exactly one cause.
species_filter:
  enabled: true
  gates:
    F0_parses:        true    # MolFromSmiles plus sanitisation succeeds
    F1_single_fragment: true  # exactly one connected fragment (excludes salts, complexes)
    F3_net_charge_zero: true  # formal charges sum to 0 (excludes ions)
    F4_no_radicals:   true    # 0 unpaired electrons (excludes carbenes, nitrenes,
                              # diradicals)
    F5_no_formal_charge: true # no atom carries a non-zero formal charge (excludes
                              # zwitterions, ylides)
    F6_elements_HCNO: false   # **off by default**, unlike stage 1 -- reason below
    F7_qm9_geometry_consistent: true  # not on QM9's official "uncharacterized" list
  # ---- f7_mode: how F7 treats that list (three ways) ---------------------------------
  #   drop_all  remove all 3054 on the list. Conservative and LOSSY: the repair paper
  #             fixed 2988 of them and found only 66 genuinely unstable, so this drops
  #             ~2.2% of QM9 to avoid 0.05%.
  #   curated   pass a listed molecule IF curatedQM9 has a geometry, and USE that
  #             geometry. Removes only what the repair workflow could not fix.
  #   off       do not apply F7. Debugging only -- it lets through molecules whose
  #             deposited geometry is a different molecule from their SMILES, which
  #             cost this repository 1399 s of CREST on dsgdb9nsd_003838.
  #
  # `curated` RAISES if the archive is absent rather than falling back to drop_all:
  # silently changing which molecules are in a dataset, because a directory was
  # missing, is exactly the condition that cannot be read off the products afterwards.
  #
  # ===== USE THE ORIGINAL QM9. `drop_all` stays the default. =====
  #
  # Geometries come from QM9 as deposited. The 3054 molecules whose deposited geometry is
  # not the molecule their SMILES names are REMOVED, not repaired: curatedQM9's repaired
  # coordinates are not used unless someone selects `curated` deliberately.
  #
  # What it costs, measured, so the choice is made with the price in view: ~2.2% of QM9
  # dropped to avoid the 0.05% that are genuinely unstable. The repair paper fixed 2988 of
  # the 3054 and found only 66 beyond saving, so most of what goes could have been kept.
  #
  # Why pay that: every geometry in the data set then comes from ONE source at ONE level
  # of theory (B3LYP/6-31G(2df,p), as deposited). `curated` would mix deposited
  # coordinates with coordinates produced by someone else's repair workflow, and the
  # products would not record which molecule got which -- the condition that has already
  # cost this repository one data set. Uniform provenance is worth 2.2%.
  #
  # `curated` REMAINS SELECTABLE and keeps its guard rail: it RAISES if the archive is
  # absent rather than falling back to drop_all, because silently changing which
  # molecules are in a data set, because a directory was missing, is exactly the kind of
  # condition that cannot be read off the products afterwards.
  #
  # This also keeps every product made before 2026-09-04 reproducible.
  f7_mode: "drop_all"               # drop_all | curated | off
  f6_note: >
    Stage 1 restricted the elements to {H,C,N,O}; that was a v0 DATA DECISION (it
    excluded all of QM9's fluorine chemistry). Stage 0's potential, MACE-OFF23, supports
    F, and stage 0's 11 edges contain no fluorine anyway, so this gate is NOT NECESSARY
    here; it is off by default rather than discard data for no reason.
    **Set it to true to make the species set comparable one-for-one with stage 1** -- a
    one-line change. Measured over indices 1-4000: turning it on removes a further 7
    molecules (0.17%).
  # ---- F7: an upstream QM9 data defect (added 2026-09-02) ------------------------------
  f7_note: >
    3054 molecules in QM9 (2.3% of 133885) have a deposited B3LYP/6-31G(2df,p) geometry
    that IS NOT THE MOLECULE their deposited SMILES describes -- the initial geometry
    (generated by Corina) rearranged or dissociated during the DFT optimisation, while
    the index still records the original SMILES. Upstream lists them separately in
    `uncharacterized.txt` (Ramakrishnan, Dral, Rupp & von Lilienfeld, Sci. Data 1,
    140022 (2014), supplementary), and this repository ships that file under
    data/qm9-uncharacterized/ with its sha256 pinned in openqha/qm9_uncharacterized.py.

    **This repository was caught by one of them.** dsgdb9nsd_003838: the index SMILES is
    `N=C1N=CON=N1` (a six-membered ring), while the deposited geometry measures as
    **7 bonds and 2 connected components** (NCNCOHH and NN -- the N2 has left). The list's
    own "SMILES parsed from the B3LYP geometry" is `[NH][C][N]C=O.N#N`, and that dot is
    the two fragments. Before this gate existed it ran all the way through CREST
    (1399 seconds) and was only caught at the graph-isomorphism step.

    **One conservative choice, with its consequence stated.** For 48 of the 3054 (1.6%)
    the GDB17 SMILES and the SMILES parsed from the B3LYP geometry actually agree -- they
    are on the list only because OpenBabel read Corina's initial guess as something else,
    and their B3LYP geometry is fine. This repository **still drops all of them**: the
    list is a published, citable, bit-reproducible object, and re-selecting within it by
    our own criterion would replace a published criterion with an unpublished one. The
    price is 48 / 133885 = 0.036% of the data.
    That is a modifiable_convention, not a derived_criterion.

  # The reach of F7. **Change this one line to switch; the consequences are measured.**
  f7_scope: "all"          # all | identity_from_geometry_only
  f7_scope_note: >
    Every row of this repository's index carries a column qm9_identity_source. Where its
    value is `relaxed`, that row's qm9_smiles WAS ITSELF PARSED FROM THE B3LYP GEOMETRY,
    so "the geometry disagrees with the SMILES" DOES NOT APPLY TO US. Measured
    distribution over the 3054:
      relaxed 1749 | gdb17 1270 | none 35
    dsgdb9nsd_003838 belongs to the gdb17 group (its relaxed SMILES is
    `[NH][C][N]C=O.N#N` -- two fragments and radical -- so the index fell back to GDB17's
    `N=C1N=CON=N1`, while the geometry is the dissociated one).

    "all" (the current value, user request 2026-09-02): drop all 3054.
      The reason is that upstream calls them **uncharacterized** -- the molecular identity
      is not established; and for a data set built on isomerisation reactions, taking an
      identity that OpenBabel guessed from a geometry as the molecular identity is a risk
      we would be carrying ourselves.
      Measured price: of the 122737 that pass F0/F1/F3/F4/F5 over the whole set,
      122737 -> 120215, **2522 fewer (2.05%)**; over indices 1-4000, 3819 -> 3749,
      **70 fewer**. 11 of those had already been through CREST (3.43 core-hours).

    "identity_from_geometry_only": drop only those whose qm9_identity_source is not
      "relaxed".
      **This is the setting that drops only what is genuinely inconsistent FOR US.** To
      use it, change the line above to this value.
      Measured price: whole set 122737 -> 121598, **1139 fewer (0.93%)**; indices 1-4000,
      3819 -> 3786, 33 fewer.

    The two settings side by side (measured 2026-09-02; script named in the checkpoint):
                                        indices 1-4000     whole set 133884
      F7 off                             3819               122737
      f7_scope = "all"                   3749  (-70)        120215  (-2522, -2.05%)
      f7_scope = "identity_from_geometry_only"
                                         3786  (-33)        121598  (-1139, -0.93%)

    NOTE, measured 2026-09-05: reading qm9_identity_source needs the QM9 index, which is
    119 MB and NOT shipped. Without it openqha/filters.py cannot classify any molecule
    and "identity_from_geometry_only" behaves exactly like "all" -- the conservative
    direction, and now visible through filters.identity_source_available() rather than
    silent. tests/unit/t_filters_f7.py reports those cases as NOT TESTED instead of
    passing them.


  provenance:
    transcribed_from: "stage1-qm9-alchemical-reaction-energy/docs/02_data_ingestion-and-filtering.md section 4.1"
    transcribed_on: "2026-08-28"
    note: "A semantic rewrite, not code reuse. Stage 0 has its own implementation in
      openqha/filters.py and its own tests."
