# ======================================================================================
# openQHA — the eleven-edge test set
# ======================================================================================
# THIS PROJECT'S OWN CAMPAIGN, not part of the method.
#
# openQHA publishes a METHOD: give it a molecule, get its conformational entropy. The
# eleven QM9 isomerisation edges below, and the seven species they name, are the test
# set this repository developed the method against. They are the debug and regression
# fixtures — nobody installing openQHA needs to re-run them.
#
# Split out of the main config on 2026-09-04 and included back through `include:`. It
# is a MOVE, not a copy: openqha/config.py raises if two files define the same key.
#
# WHAT IS ACTUALLY DISTRIBUTED WITH THE REPOSITORY
#   the 7 reference geometries (11 KB) plus a 7-row excerpt of the QM9 index. That is
#   what lets the core deliverable reproduce with no external data at all.
#   Full QM9 and curatedQM9 are placed by the user; neither goes into version control.
#
# WHY sigma AND g0 ARE DECLARED HERE AND NOT DERIVED
#   They must be declared, never guessed. openqha/symmetry.py can now derive
#   sigma from the geometry, and these declarations remain the INDEPENDENT ANSWERS the
#   derivation is checked against — 7/7 agreement, including acetone, which ORCA gets
#   wrong (C1, sigma=1; correct is C2v, sigma=2, worth RT ln 2 = 0.411 kcal/mol).
#
#   One declaration is deliberately CONDITIONAL: oxetane is C2v with sigma = 2 when the
#   ring is planar and Cs with sigma = 1 when puckered. A conditional declaration does
#   NOT override the per-basin geometric value — letting it win would silently give
#   every puckered basin the planar number.
#
# THE `zh:` FIELD WAS REMOVED ON 2026-09-09
#   Each species carried a Chinese common name beside `name`. It was DATA, not a
#   comment: two calibration scripts read `spec["zh"]` and one wrote it into product
#   records. It was also redundant -- `name` and `smiles` identify the species, and a
#   Chinese display label has no place in a config that ships with an English-only
#   open-source package. The readers now use `name`.
#   **This changed a product record schema**: records written before this date carry a
#   `zh` key and records written after do not. Nothing downstream keys on it.
# ======================================================================================


# --------------------------------------------------------------------------------------
# Edges and species -- transcribed once from stage 2; this file is the source of truth from here on
# --------------------------------------------------------------------------------------
edges_provenance:
  transcribed_from: "stage2-lambda-delta0-mace-learning/configs/r0_production.yaml"
  transcribed_on: "2026-08-28"
  ordering: "priority order, most informative first -- verbatim from the source"


edges:
  - "C2H5O1N1_19_36"        # the only edge containing all four of C, H, N, O
  - "C3H6O1N0_18_35"
  - "C3H6O1N0_18_44"
  - "C3H6O1N0_18_46"
  - "C3H6O1N0_18_48"
  - "C3H6O1N0_35_44"
  - "C3H6O1N0_35_46"
  - "C3H6O1N0_35_48"
  - "C3H6O1N0_44_46"
  - "C3H6O1N0_44_48"
  - "C3H6O1N0_46_48"


# External symmetry number sigma and electronic ground-state degeneracy g0:
# **declared explicitly, never derived automatically; a missing one refuses to run**.
# Getting sigma wrong does not cancel between isomers and costs up to about 3 kcal/mol
# (graph automorphism counts internal rotors as well, overcounting ethane 12-fold and
# cyclohexane 128-fold).
species:
  dsgdb9nsd_000018:
    name: "acetone"
    smiles: "CC(=O)C"
    symmetry_number: 2
    symmetry_reason: "C2v: the C2 axis runs through the carbonyl carbon and oxygen, exchanging the two methyls"
    electronic_degeneracy: 1
  dsgdb9nsd_000019:
    name: "acetamide"
    smiles: "CC(=O)N"
    symmetry_number: 1
    symmetry_reason: "Cs: no proper rotation axis"
    electronic_degeneracy: 1
  dsgdb9nsd_000035:
    name: "propanal"
    smiles: "CCC=O"
    symmetry_number: 1
    symmetry_reason: "Cs: no proper rotation axis"
    electronic_degeneracy: 1
    # Experimental gas-phase absolute entropy at 298.15 K (cal/mol/K): the LBH set as
    # tabulated in pracht2021's ESI Table 1 (propionaldehyde, entry 27). A value without a
    # source key resolvable in docs/cite/cite_openQHA.bib is refused.
    experimental_entropy_cal_per_K: 72.75
    experimental_entropy_source: "li2016lbh"
  dsgdb9nsd_000036:
    name: "N-methylformamide"
    smiles: "CNC=O"
    symmetry_number: 1
    symmetry_reason: "Cs: no proper rotation axis"
    electronic_degeneracy: 1
  dsgdb9nsd_000044:
    name: "2-methyloxirane"
    smiles: "C[C@H]1CO1"
    symmetry_number: 1
    symmetry_reason: "C1: a stereocentre, no symmetry element"
    electronic_degeneracy: 1
  dsgdb9nsd_000046:
    name: "cyclopropanol"
    smiles: "OC1CC1"
    symmetry_number: 1
    symmetry_reason: "the hydroxyl orientation destroys the mirror plane"
    electronic_degeneracy: 1
  dsgdb9nsd_000048:
    name: "oxetane"
    smiles: "C1COC1"
    symmetry_number: 2
    symmetry_reason: >
      Planar C2v -> sigma=2. **This one is conditional**: if the lowest basin is puckered
      (the C2 axis is broken), strict Cs gives sigma=1, a difference of
      kT ln2 = 0.41 kcal/mol.
      Decided at run time from the measured ring planarity: a maximum distance to the
      best-fit plane below planarity_tol_A is treated as planar.
    electronic_degeneracy: 1
    conditional:
      planarity_tol_A: 0.05      # modifiable_convention
      symmetry_number_if_puckered: 1
