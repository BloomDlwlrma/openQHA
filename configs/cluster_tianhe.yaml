# --------------------------------------------------------------------------------------
# Cluster (Tianhe TianheXY-AI) -- site information supplied by the user on 2026-08-31
# --------------------------------------------------------------------------------------
# **This section RECORDS known site facts; it is not something the repository consults
# automatically.** The job scripts are in .mem/plan/plan_pkg1-cluster-tianhe.md and are
# submitted by hand.
cluster:
  name: "TianheXY-AI"
  scheduler:
    submit: "yhbatch"           # the interactive form is yhrun
    directives: "#SBATCH"       # **the site scripts really do use #SBATCH** -- it is a Slurm derivative
    gpu_flag: "-G"              # **-G must be given explicitly or the job is not accepted** (site announcement 2025-06-24)
    examples:
      - "yhrun -p <partition> -G 1 hostname"
      - "yhbatch -p <partition> -G <number of GPUs> <script>"
    max_walltime_per_job_days: 7      # user, 2026-08-31: any single job under 7 days is fine
    note: >
      The site announcement says the hx/h100x/a100x/a800x/v100x partitions allocate at
      **GPU card** granularity, and the scheduler hands out that many cards per -G.
      **Whether job arrays are available has not been confirmed** -- the site example
      submits several independent jobs in a loop, and this repository's --shard k/n
      supports either way.
  partitions:
    - name: "h100x"
      kind: "gpu"
      note: "H100 80 GB; 1 GPU / 14 CPUs / 240 GB (D0-56). **Billed per GPU**"
    - name: "a100x"
      kind: "gpu"
    - name: "a800x"
      kind: "gpu"
    - name: "v100x"
      kind: "gpu"
    - name: "hx"
      kind: "gpu"
  paths:
    home: "/HOME/hku2021_fos4/hku2021_fos4xy_2"
    home_alt: "/XYAIFS00/HOME/hku2021_fos4/hku2021_fos4xy_2"   # the same one, under another mount name
    conda_init: "~/init_conda.sh"        # miniforge3 + mamba, already set up by the user
    proxy: "source /APP/u22/ai_x86/toolshs/setproxy.sh 172.16.31.200 3138"
    proxy_note: >
      **A proxy is available and reaches the outside network**, so installing packages
      with conda/pip is workable and an Apptainer image is not needed. This settles the
      "software environment" item the plan had left open.
  scratch:
    # The form the user specified on 2026-08-31 (copied from the ORCA_SCR pattern they
    # gave): prefer $TMPDIR (node-local NVMe/SSD), fall back to /tmp, and
    # **never write temporary files on Lustre**.
    prefer: "$TMPDIR"
    fallback: "/tmp"
    pattern: "${TMPDIR:-/tmp}/$USER/s0tf_${SLURM_JOB_ID}_${ARRAY_ID}"
    why: >
      CREST writes many small files into parallel _N subdirectories (measured on this
      workstation: one molecule's working directory is 2.6-15 MB across dozens of
      files). Doing that on Lustre is slow for the job and slow for the whole filesystem.
  quirks:
    - "ulimit -l unlimited  -- the site script notes that the parallel run fails without it"
    - "export GLEX_USE_ZC_RNDV=0  -- present in the site script; related to the GLEX network"
    - "CUDA 11.8 and gcc 11.4 are already available (conda environment cuda11) and can be used for building directly"
  # ---- Staging (user ruling 2026-08-31) ------------------------------------------------
  # Stage one puts CREST sampling on a pure CPU partition; stage two (tightening +
  # Hessian) is where it is worth asking whether a GPU pays for itself.
  # The products of the two stages land in **different subdirectories of the same result
  # root**, told apart by --stage.
  staging:
    stage1: {name: "stage1-crest", phase: "crest",
             note: "GFN-FF driven metadynamics + MACE single points at refine=sp (MACE runs on the CPU)"}
    stage2: {name: "stage2-mace", phase: "analyse",
             note: "tightening to fmax=1e-4 + pooled deduplication + Hessian; the one stage that **might** benefit from a GPU"}
    submit_note: >
      Stage two is chained after stage one with --dependency=afterok:<stage one job id>
      so it starts automatically; the summary step (parquet concatenation) is chained
      after stage two in turn.
