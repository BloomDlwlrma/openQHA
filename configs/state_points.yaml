# --------------------------------------------------------------------------------------
# Package 3 -- near-critical gas-phase state points (added 2026-08-31)
# --------------------------------------------------------------------------------------
# **Why it is needed**: on 2026-08-31 the user ruled that package 3 moves to a **real
#   multi-molecule gas phase**, using "near-critical / near-saturated dense gas plus
#   thermodynamic extrapolation" (option A).
#   At 298.15 K the saturated vapour of this system is far too dilute (acetone
#   0.0074 nm^-3, a collision interval of about 368 ps), so the simulation has to run at
#   a near-critical temperature and be extrapolated back to 298.15 K by
#   S(T2) = S(T1) + integral Cp/T dT.
#
# **Data source**: `chemicals` 1.5.2 (Caleb Bell); the per-entry method names are in
#   tc_source below.
#   **Note that Tc/Pc for cyclopropanol are a JOBACK group-contribution estimate, not
#   an experimental value.**
# **Saturated vapour pressure**: the Lee-Kesler corresponding-states correlation.
#   **The number density is the ideal-gas n = P/kT and is therefore too low near
#   saturation** (the real Z < 1, so this is a lower bound). Production work should
#   recalibrate it against the simulated virial pressure.
# Generating script: `scripts/_superseded/branch1-archived/s0_species_critical_constants.py`
#   Product: `analysis/species_critical_constants.json`
package3_state_points:
  reference_reduced_temperature: 0.886   # modifiable_convention: the near-critical gas point commonly used in the literature
  target_state: "298.15 K, 1 bar ideal-gas standard state (reached by extrapolating from the simulated point)"
  extrapolation:
    pressure: "S(P) = S(P_sat) - R ln(P/P_sat); E(P) = E(P_sat) (the Joule law)"
    temperature: "S(T2) = S(T1) + integral Cp/T dT; **this is the largest approximation on this route**"
  species:
    dsgdb9nsd_000018:
      name: "acetone"
      cas: "67-64-1"
      Tc_K: 508.1
      Pc_bar: 46.9
      acentric_factor: 0.307
      tc_source: "HEOS, IUPAC, CRC"
      at_Tr_0.886:
        temperature_K: 450.2
        Psat_bar: 19.00
        number_density_nm3: 0.3057
        box_length_A_27mol: 44.5
        collision_interval_ps: 7.26
        extrapolation_span_K: 152.0   # 450.2 - 298.15
