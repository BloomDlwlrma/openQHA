# --------------------------------------------------------------------------------------
# 包 3 —— 近临界气相的状态点（2026-08-31 加入）
# --------------------------------------------------------------------------------------
# **为什么需要它**：2026-08-31 用户裁定包 3 改走**真实多分子气相**，
#   并用「近临界/近饱和高密度气相 + 热力学外推」（方案甲）。
#   298.15 K 时本体系的饱和蒸气太稀（丙酮 0.0074 nm^-3，碰撞间隔约 368 ps），
#   所以必须在近临界温度模拟，再按 S(T2)=S(T1)+∫Cp/T dT 外推回 298.15 K。
#
# **数据来源**：`chemicals` 1.5.2（Caleb Bell），逐条方法名见下面的 tc_source。
#   **注意 cyclopropanol 的 Tc/Pc 是 JOBACK 基团贡献法的估计值，不是实验值。**
# **饱和蒸气压**：Lee–Kesler 对比关联式；**数密度按理想气体 n = P/kT，近饱和时偏低**
#   （真实 Z < 1，故这是下限）。生产时应以模拟的位力压力回校。
# 生成脚本：`scripts/_superseded/branch1-archived/s0_species_critical_constants.py`
#   产物：`analysis/species_critical_constants.json`
package3_state_points:
  reference_reduced_temperature: 0.886   # modifiable_convention：参考文献近临界气相常用点
  target_state: "298.15 K, 1 bar 理想气体标准态（由模拟点外推得到）"
  extrapolation:
    pressure: "S(P) = S(P_sat) - R ln(P/P_sat)；E(P) = E(P_sat)（焦耳定律）"
    temperature: "S(T2) = S(T1) + ∫ Cp/T dT；**这是本路线最大的近似**"
  species:
