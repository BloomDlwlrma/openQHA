# openQHA -- Hessian screen, RRHO tolerances and the electronic reference ladder. Branch A reads fmax_hessian_eV_A on every run.
#
# Split out of configs/openqha.yaml on 2026-09-04 (user ruling): that file
# now holds ONLY global configuration and the `include:` index. This is a
# MOVE, not a copy -- openqha/config.py raises if two files define the same
# key -- and it was moved by byte range, so every comment and every measured
# number came with it verbatim.
# ======================================================================

# ======================================================================================
# Branch A -- basin list criteria
# ======================================================================================
# MOVED to configs/conformers.yaml on 2026-09-04, and merged back in through the
# `include:` list at the top of this file. It is a MOVE, not a copy: `package1:` is
# defined in exactly one place, and openqha/config.py raises if two files define it.
#
# Everything measured in it went with it -- the four-arm SHAKE attribution, the
# refine=opt/sp comparison, the deduplication threshold sweep. Nothing was summarised
# away in the move.
# ======================================================================================

# --------------------------------------------------------------------------------------
# Package 2 -- the Hessian side-channel and the frequency benchmark
# --------------------------------------------------------------------------------------
package2:
  fmax_hessian_eV_A: 0.0001          # numerical_tolerance: residual force contaminates
                                     # the curvature
  finite_difference_delta_A: 0.01    # modifiable_convention; convergence measured (D0-34)
  delta_scan_A: [0.005, 0.010, 0.020, 0.040]
  delta_scan_species: "dsgdb9nsd_000048"   # oxetane -- it has the softest ring-fold mode
  rigid_singular_tol: 1.0e-8         # numerical_tolerance: rank criterion for the set
                                     # of rigid-body vectors
  rigid_overlap_threshold: 0.5       # derived_criterion: the fraction of an eigenvector
                                     # lying in the rigid-body subspace
  reject_imaginary_frequencies: true # derived_criterion: only true minima enter the sum
  qrrho_nu0_cm: 100.0                # literature_value: Grimme, Chem. Eur. J. 2012, 18, 9955
  # ---- Reference level (user ruling 2026-08-29: use the full composite, and stop
  # ---- computing CCSD(T)/cc-pVTZ directly) ---------------------------------------------
  # Following Allen et al., "Reactive Chemistry at Unrestricted Coupled Cluster Level"
  # (equations 1 and 2). The paper gives composite expressions for BOTH the energy and the
  # forces; numerical frequencies come from finite differences of the forces, so a
  # composite force expression gives a composite Hessian directly.
  # Measured (acetone, 10 atoms, ORCA 6.0.1, 8 cores, one analytic gradient; see D0-73):
  #   MP2/DZ 5 s | MP2/TZ 30 s | MP2/QZ 321 s | CCSD/DZ 65 s | CCSD(T)/DZ 326 s | CCSD/TZ 435 s
  #   for comparison CCSD(T)/TZ did not finish in > 7200 s; the six components' scratch
  #   files come to 17 MB in total, against 144 GB for a single CCSD(T)/TZ.
  reference_level: "composite_TZstar_ccsd"
  reference_spin: "restricted"       # every system here is a neutral closed-shell
                                     # equilibrium minimum (gate F4 guarantees it), so R
                                     # and not U
  composite_recipes:
    smoke_mp2_dz:                    # **SMOKE TEST ONLY** -- a single term, not a
                                     # composite; it exists to get the wiring to run
      target: "MP2/cc-pVDZ single point, to verify the composite pipeline is wired up"
      terms:
        - [1, "MP2", "cc-pVDZ"]
      seconds_per_gradient_8core: 5
    # Each term is [coefficient, method, basis]; forces and Hessians combine linearly
    # with those coefficients
    composite_TZstar_ccsd:           # **IN USE** -- a CCSD increment corrects
                                     # CCSD(T)/DZ up to TZ
      target: "composite approximation to CCSD(T)/cc-pVTZ"
      terms:
        - [1, "CCSD(T)", "cc-pVDZ"]
        - [1, "CCSD", "cc-pVTZ"]
        - [-1, "CCSD", "cc-pVDZ"]
      seconds_per_gradient_8core: 826
    composite_TZstar_mp2:            # cheaper and less accurate (it is what the paper's
                                     # figure S1c compares against)
      target: "composite approximation to CCSD(T)/cc-pVTZ, increment taken from MP2"
      terms:
        - [1, "CCSD(T)", "cc-pVDZ"]
        - [1, "MP2", "cc-pVTZ"]
        - [-1, "MP2", "cc-pVDZ"]
      seconds_per_gradient_8core: 361
    composite_QZstar:                # the full form of the paper's equations 1 and 2,
                                     # targeting QZ
      target: "composite approximation to CCSD(T)/cc-pVQZ"
      terms:
        - [1, "CCSD(T)", "cc-pVDZ"]
        - [1, "CCSD", "cc-pVTZ"]
        - [-1, "CCSD", "cc-pVDZ"]
        - [1, "MP2", "cc-pVQZ"]
        - [-1, "MP2", "cc-pVTZ"]
      seconds_per_gradient_8core: 1177
    # ---- User ruling 2026-08-29, the accuracy of E2: "MP2 DZ* -> QZ*" ---------------
    # A basis-set ladder using **MP2 increments only**, on a CCSD(T)/cc-pVDZ base, with
    # all three rungs assembled from ONE pool of terms:
    #   DZ      = CCSD(T)/DZ
    #   TZ*_mp2 = CCSD(T)/DZ + (MP2/TZ - MP2/DZ)
    #   QZ*_mp2 = CCSD(T)/DZ + (MP2/QZ - MP2/DZ)
    # **The three rungs share one pool** (4 single points: CCSD(T)/DZ, MP2/DZ, MP2/TZ,
    # MP2/QZ), so the cost of measuring the WHOLE ladder equals the cost of its highest
    # rung -- **the two middle rungs are free** -- and "has the ladder converged" stops
    # being an assumption and becomes a number you can read.
    dz_base:                         # rung 0 of the ladder: no basis-set correction
      target: "CCSD(T)/cc-pVDZ (the base of the ladder, not a composite)"
      terms:
        - [1, "CCSD(T)", "cc-pVDZ"]
      seconds_per_gradient_8core: 326
    composite_QZstar_mp2:            # **IN USE for E2** -- one MP2 increment straight
                                     # to QZ
      target: "composite approximation to CCSD(T)/cc-pVQZ, all basis increments from MP2"
      terms:
        - [1, "CCSD(T)", "cc-pVDZ"]
        - [1, "MP2", "cc-pVQZ"]
        - [-1, "MP2", "cc-pVDZ"]
      seconds_per_gradient_8core: 652
    smoke_hf_dz:                     # **SMOKE TEST ONLY** -- the cheapest possible term,
                                     # purely to verify the ladder's wiring
      target: "HF/cc-pVDZ single point, about 1 second"
      terms:
        - [1, "HF", "cc-pVDZ"]
      seconds_per_gradient_8core: 1
  # Run the whole ladder at once: the driver solves by **term pool**, so a single point
  # shared between rungs is computed only once
  recipe_ladders:
    smoke_hf_to_mp2:                 # **SMOKE TEST ONLY**: two rungs sharing cc-pVDZ,
                                     # about 6 seconds per structure
      description: "verifies the pool / combination / ladder / resume wiring; it produces
        no number with any physical meaning"
      recipes: ["smoke_hf_dz", "smoke_mp2_dz"]
      pool_seconds_per_structure_8core: 6
    mp2_dz_to_qz:
      description: "MP2-increment ladder DZ -> TZ* -> QZ*, sharing one term pool"
      recipes: ["dz_base", "composite_TZstar_mp2", "composite_QZstar_mp2"]
      pool_seconds_per_structure_8core: 682   # 326 + 5 + 30 + 321
  reference_level_rejected:
    - level: "r2SCAN-3c"
      reason: "excluded by user ruling 2026-08-28"
    - level: "CCSD(T)/cc-pVTZ computed directly"
      reason: >
        Measured as unaffordable: a single analytic gradient did not finish in > 7200
        seconds and used 144 GB of scratch; 61 of them x 7 species >= 36 days.
        See D0-66, D0-69, D0-73.


