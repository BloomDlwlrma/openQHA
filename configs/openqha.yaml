# stage 0 生产配置 —— **本仓唯一的事实来源**
#
# 2026-08-28 起，stage 0 是一个**独立的开源框架**，将单独推到 GitHub。
# 因此它**不再从 stage 1 / stage 2 读取任何东西**：边集、物种表、对称数、参数、
# 数据路径，全部在本文件里重写一遍。凡是从别处抄来的，都在 `provenance` 里写明
# 出处与抄写日期，并留一个校验和，好让日后的漂移能被发现，而不是被继承。
#
# 参数分类沿用 stage 1 / stage 2 的五类（见 .mem/skills/skill_stage0-standards.md §1.4）：
#   physical_constant | derived_criterion | literature_value | modifiable_convention
#   | numerical_tolerance | resource_budget

include:
  # Sections that live in their own files. Resolved relative to this file,
  # one level deep, and a key defined twice is an error rather than a race.
  - conformers.yaml          # branch A: crest:, package1:
  - edges_testset.yaml       # this project's own campaign: edges:, species:
  - filters.yaml             # species_filter
  - hessian.yaml             # package2
  - branchB_protocol.yaml    # branch B: how long, how often (the published protocol)
  - state_points.yaml        # package3_state_points
  - electronic.yaml          # package5
  - cluster_tianhe.yaml      # cluster

meta:
  name: "stage0-production"
  description: "不含炼金的对比样：构象 → 动力学 → 态密度 → 加耦合簇单点"
  written: "2026-08-28"

# --------------------------------------------------------------------------------------
# 运行时的落地位置 —— **本仓在机器上写东西的唯一根**
# --------------------------------------------------------------------------------------
# 用户 2026-08-31 裁定：「不要直接把东西存在 ~ 下，/home 里文件太多了；
# 改到 \wsl.localhost\Ubuntu-24.04\home\ubuntu\runs\openQHA」（即 /home/ubuntu/runs/openQHA）。
#
# **为什么重活不放 /mnt/c**：CREST 在并行 `_N` 子目录里写大量小文件，
# 走 9p（Windows 挂载）会被 I/O 拖住。产物算完再拷回仓内 —— 拷的是结果，不是过程。
#
# 目录约定（全部由 openqha.config.runs_dir() 派生，脚本里不再出现字面路径）：
#   crest_batch/  包 1 批量的 CREST 工作目录       crest_work/  单物种实验
#   build/        CREST 构建树                     verify/      补丁验证
#   sockets/      常驻 MACE 服务端的套接字与日志    logs/        驱动日志
#   legacy/       2026-08-31 之前散落在 ~ 下的旧目录    tmp/  临时
runtime:
  runs_root: "~/runs/openQHA"        # resource_budget；可被环境变量 S0_RUNS_ROOT 覆盖
  # `~/crest_build` 现在是一个**符号链接**，指向 runs_root/build/crest_build。
  # 留它的唯一理由：build-patched/crest 的 RUNPATH 里烧死了
  # `/home/ubuntu/crest_build/lib` 这个绝对路径，删掉链接那个二进制就找不到自己的 .so。
  legacy_symlink_note: "~/crest_build -> runs_root/build/crest_build (RUNPATH 是绝对路径)"

# --------------------------------------------------------------------------------------
# 热力学状态
# --------------------------------------------------------------------------------------
thermodynamics:
  temperature_K: 298.15          # modifiable_convention：目标态；换温度须整条链一起换
  pressure_Pa: 100000.0          # modifiable_convention：1 bar 标准态
  target_accuracy_kcal: 1.0      # derived_criterion：每一项近似都拿它当判据尺度

# --------------------------------------------------------------------------------------
# 势 —— 唯一的一个
# --------------------------------------------------------------------------------------
engine:
  name: "MACE-OFF23-SC"
  # PATH IS NOT AUTHORITATIVE HERE. openqha/engine.py holds the registry and
  # SEARCHES for the model root (S0_MACE_ROOT overrides), because the reference
  # tree has now moved twice. This line records WHICH weights, not where.
  weights: "../source-code/MACE-OFF23-SC-main/MACE-OFF23-SC_swa.model"
  sha256: "32c9fb51704f96da"        # 前 16 位；完整值由 openqha.engine.provenance() 现算并比对
  dtype: "float64"                  # numerical_tolerance：几何优化与有限差分 Hessian 都要它
  device: "cpu"
  licence: "Academic Software Licence (ASL) —— 学术非商业"
  source: "https://arxiv.org/abs/2405.18171"
  # 权重缺失时**抛异常，绝不回退到别的势**。静默换势会让下游每个数字失去它标称的层级。
  fallback_allowed: false

# --------------------------------------------------------------------------------------
# 数据 —— 本地路径，不指向任何别的 stage
# --------------------------------------------------------------------------------------
# QM9 原始数据体量大（索引 119 MB、几何 224 MB），**不进 git**。
# 用 `python scripts/tooling/s0_prepare_data.py --from <某个 QM9 目录>` 把它放进 data/，
# 或设环境变量 S0_QM9_ROOT 指向别处。
# 只有 7 个目标物种的参考几何是**随仓库分发**的（7 个文件，几 KB），
# 这样 stage 0 的核心交付（包 2）零外部数据即可复现。
data:
  qm9_root: "data/qm9"                       # 相对本仓根；可被 S0_QM9_ROOT 覆盖
  qm9_index_csv: "index_Chem_composition.csv"
  qm9_xyz_dir: "xyz_files"
  # curatedQM9: repaired geometries for the molecules QM9 could not characterise.
  # Senthil, Chakraborty & Ramakrishnan, Chem. Sci. 2021, 12, 5566 (10.1039/D0SC05591C).
  # Unpack the archive under data/qm9/ ; S0_CURATED_QM9 overrides the location.
  # Measured on the 133 661 files present -- the archive uses THREE naming patterns:
  #     dsgdb9nsd_XXXXXX.xyz        130 831   untouched QM9 originals
  #     dsgdb9nsd_XXXXXX_new.xyz      1 257   repaired, QM9-style tag
  #     dsgdb9_XXXXXX_new.xyz         1 573   repaired, short tag
  # A lookup assuming one pattern would silently miss most of the repairs.
  curated_qm9_dir: "133660_curatedQM9_outof_133885"
  vendored_reference_geometries: "data/reference-geometries"   # 随仓库分发的 7 个
  upstream:
    dataset: "QM9 (GDB-9), Ramakrishnan et al., Sci. Data 2014, 1, 140022"
    note: >
      索引表的列（转动常数 A/B/C、全部 3N-6 个谐振频率、zpve、U0/U/H/G、Cv）
      是 B3LYP/6-31G(2df,p) 的原生值，stage 0 只把它们当**免费的对比样**，
      不当作参考层级。

