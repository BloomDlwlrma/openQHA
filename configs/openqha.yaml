# stage 0 生产配置 —— **本仓唯一的事实来源**
#
# 2026-08-28 起，stage 0 是一个**独立的开源框架**，将单独推到 GitHub。
# 因此它**不再从 stage 1 / stage 2 读取任何东西**：边集、物种表、对称数、参数、
# 数据路径，全部在本文件里重写一遍。凡是从别处抄来的，都在 `provenance` 里写明
# 出处与抄写日期，并留一个校验和，好让日后的漂移能被发现，而不是被继承。
#
# 参数分类沿用 stage 1 / stage 2 的五类（见 .mem/skills/skill_stage0-standards.md §1.4）：
#   physical_constant | derived_criterion | literature_value | modifiable_convention
#   | numerical_tolerance | resource_budget

include:
  # Sections that live in their own files. Resolved relative to this file,
  # one level deep, and a key defined twice is an error rather than a race.
  - conformers.yaml          # branch A: crest:, package1:
  - edges_testset.yaml       # this project's own campaign: edges:, species:

meta:
  name: "stage0-production"
  description: "不含炼金的对比样：构象 → 动力学 → 态密度 → 加耦合簇单点"
  written: "2026-08-28"

# --------------------------------------------------------------------------------------
# 运行时的落地位置 —— **本仓在机器上写东西的唯一根**
# --------------------------------------------------------------------------------------
# 用户 2026-08-31 裁定：「不要直接把东西存在 ~ 下，/home 里文件太多了；
# 改到 \wsl.localhost\Ubuntu-24.04\home\ubuntu\runs\openQHA」（即 /home/ubuntu/runs/openQHA）。
#
# **为什么重活不放 /mnt/c**：CREST 在并行 `_N` 子目录里写大量小文件，
# 走 9p（Windows 挂载）会被 I/O 拖住。产物算完再拷回仓内 —— 拷的是结果，不是过程。
#
# 目录约定（全部由 openqha.config.runs_dir() 派生，脚本里不再出现字面路径）：
#   crest_batch/  包 1 批量的 CREST 工作目录       crest_work/  单物种实验
#   build/        CREST 构建树                     verify/      补丁验证
#   sockets/      常驻 MACE 服务端的套接字与日志    logs/        驱动日志
#   legacy/       2026-08-31 之前散落在 ~ 下的旧目录    tmp/  临时
runtime:
  runs_root: "~/runs/openQHA"        # resource_budget；可被环境变量 S0_RUNS_ROOT 覆盖
  # `~/crest_build` 现在是一个**符号链接**，指向 runs_root/build/crest_build。
  # 留它的唯一理由：build-patched/crest 的 RUNPATH 里烧死了
  # `/home/ubuntu/crest_build/lib` 这个绝对路径，删掉链接那个二进制就找不到自己的 .so。
  legacy_symlink_note: "~/crest_build -> runs_root/build/crest_build (RUNPATH 是绝对路径)"

# --------------------------------------------------------------------------------------
# 热力学状态
# --------------------------------------------------------------------------------------
thermodynamics:
  temperature_K: 298.15          # modifiable_convention：目标态；换温度须整条链一起换
  pressure_Pa: 100000.0          # modifiable_convention：1 bar 标准态
  target_accuracy_kcal: 1.0      # derived_criterion：每一项近似都拿它当判据尺度

# --------------------------------------------------------------------------------------
# 势 —— 唯一的一个
# --------------------------------------------------------------------------------------
engine:
  name: "MACE-OFF23-SC"
  # PATH IS NOT AUTHORITATIVE HERE. openqha/engine.py holds the registry and
  # SEARCHES for the model root (S0_MACE_ROOT overrides), because the reference
  # tree has now moved twice. This line records WHICH weights, not where.
  weights: "../source-code/MACE-OFF23-SC-main/MACE-OFF23-SC_swa.model"
  sha256: "32c9fb51704f96da"        # 前 16 位；完整值由 openqha.engine.provenance() 现算并比对
  dtype: "float64"                  # numerical_tolerance：几何优化与有限差分 Hessian 都要它
  device: "cpu"
  licence: "Academic Software Licence (ASL) —— 学术非商业"
  source: "https://arxiv.org/abs/2405.18171"
  # 权重缺失时**抛异常，绝不回退到别的势**。静默换势会让下游每个数字失去它标称的层级。
  fallback_allowed: false

# --------------------------------------------------------------------------------------
# 数据 —— 本地路径，不指向任何别的 stage
# --------------------------------------------------------------------------------------
# QM9 原始数据体量大（索引 119 MB、几何 224 MB），**不进 git**。
# 用 `python scripts/tooling/s0_prepare_data.py --from <某个 QM9 目录>` 把它放进 data/，
# 或设环境变量 S0_QM9_ROOT 指向别处。
# 只有 7 个目标物种的参考几何是**随仓库分发**的（7 个文件，几 KB），
# 这样 stage 0 的核心交付（包 2）零外部数据即可复现。
data:
  qm9_root: "data/qm9"                       # 相对本仓根；可被 S0_QM9_ROOT 覆盖
  qm9_index_csv: "index_Chem_composition.csv"
  qm9_xyz_dir: "xyz_files"
  # curatedQM9: repaired geometries for the molecules QM9 could not characterise.
  # Senthil, Chakraborty & Ramakrishnan, Chem. Sci. 2021, 12, 5566 (10.1039/D0SC05591C).
  # Unpack the archive under data/qm9/ ; S0_CURATED_QM9 overrides the location.
  # Measured on the 133 661 files present -- the archive uses THREE naming patterns:
  #     dsgdb9nsd_XXXXXX.xyz        130 831   untouched QM9 originals
  #     dsgdb9nsd_XXXXXX_new.xyz      1 257   repaired, QM9-style tag
  #     dsgdb9_XXXXXX_new.xyz         1 573   repaired, short tag
  # A lookup assuming one pattern would silently miss most of the repairs.
  curated_qm9_dir: "133660_curatedQM9_outof_133885"
  vendored_reference_geometries: "data/reference-geometries"   # 随仓库分发的 7 个
  upstream:
    dataset: "QM9 (GDB-9), Ramakrishnan et al., Sci. Data 2014, 1, 140022"
    note: >
      索引表的列（转动常数 A/B/C、全部 3N-6 个谐振频率、zpve、U0/U/H/G、Cv）
      是 B3LYP/6-31G(2df,p) 的原生值，stage 0 只把它们当**免费的对比样**，
      不当作参考层级。

# --------------------------------------------------------------------------------------
# 物种筛选 —— 语义逐条重写自 stage 1 的门 F0–F6
# --------------------------------------------------------------------------------------
# 用户 2026-08-28 裁定：**只考虑不带孤立电子、净电荷为 0 的中性分子**。
# stage 1 的 docs/02 §4.1 把这件事拆成了可分别计数的门，这里逐条重写（**不是引用**）。
# 顺序是规范的且短路：第一个失败的门即判出局，因此每一次剔除都只归因于一个原因。
species_filter:
  enabled: true
  gates:
    F0_parses:        true    # MolFromSmiles + 净化成功
    F1_single_fragment: true  # 恰好一个连通片段（排除盐、复合物）
    F3_net_charge_zero: true  # 形式电荷之和为 0（排除离子）
    F4_no_radicals:   true    # 孤立电子数为 0（排除卡宾、氮宾、双自由基）
    F5_no_formal_charge: true # 没有任何原子带非零形式电荷（排除两性离子、叶立德）
    F6_elements_HCNO: false   # **默认关闭**，与 stage 1 不同 —— 理由见下
    F7_qm9_geometry_consistent: true  # not on QM9's official "uncharacterized" list
  # ---- f7_mode: how F7 treats that list (three ways) ---------------------------------
  #   drop_all  remove all 3054 on the list. Conservative and LOSSY: the repair paper
  #             fixed 2988 of them and found only 66 genuinely unstable, so this drops
  #             ~2.2% of QM9 to avoid 0.05%.
  #   curated   pass a listed molecule IF curatedQM9 has a geometry, and USE that
  #             geometry. Removes only what the repair workflow could not fix.
  #   off       do not apply F7. Debugging only -- it lets through molecules whose
  #             deposited geometry is a different molecule from their SMILES, which
  #             cost this repository 1399 s of CREST on dsgdb9nsd_003838.
  #
  # `curated` RAISES if the archive is absent rather than falling back to drop_all:
  # silently changing which molecules are in a dataset, because a directory was
  # missing, is exactly the condition that cannot be read off the products afterwards.
  #
  # Default stays drop_all so every product made before 2026-09-04 stays reproducible.
  # Switching the default is a separate decision from making the switch exist.
  f7_mode: "drop_all"               # drop_all | curated | off
  f6_note: >
    stage 1 把元素限制在 {H,C,N,O} 是 v0 的一个**数据决定**（排除 QM9 的全部氟化学）。
    stage 0 的势 MACE-OFF23 支持 F，且 stage 0 的 11 条边本来就不含氟，
    所以这道门在这里**不是必要的**；默认关闭以免无理由地丢数据。
    **若要与 stage 1 的物种集逐一可比，把它改成 true** —— 这是一行的事。
    编号 1–4000 实测：开启会再剔除 7 个（0.17%）。
  # ---- F7：QM9 上游数据缺陷（2026-09-02 补，缺陷 63）------------------------------------
  f7_note: >
    QM9 里有 3054 个分子（133885 的 2.3%），**上游存进去的 B3LYP/6-31G(2df,p) 几何
    与上游存进去的 SMILES 不是同一个分子** —— 初始几何（Corina 生成）在 DFT 优化中
    重排或解离了，而索引里仍然记着原来的 SMILES。上游把它们单独列成
    `uncharacterized.txt`（Ramakrishnan, Dral, Rupp & von Lilienfeld,
    Sci. Data 1, 140022 (2014) 附件），本仓把该文件随仓库分发在
    data/qm9-uncharacterized/，sha256 写死在 openqha/qm9_uncharacterized.py 里。

    **本仓因此栽过一次**：dsgdb9nsd_003838，索引 SMILES 是 `N=C1N=CON=N1`（六元环），
    而存的几何实测是 **7 根键、2 个连通分量**（NCNCOHH 与 NN，即 N2 已脱离）；
    名单自己给出的"B3LYP 几何解析结果"是 `[NH][C][N]C=O.N#N`，那个点号就是两个片段。
    在这道门加上之前，它一路跑完 CREST（1399 秒）才在图同构那一步被接住。

    **一处已声明后果的保守**：名单 3054 条里有 48 条（1.6%）的 GDB17 SMILES 与
    B3LYP 几何解析结果其实相同 —— 它们进名单只因为 Corina 的初始猜测被 OpenBabel
    解析成了别的东西，B3LYP 几何是好的。本仓**仍然全部剔除**：名单是已发表、
    可引用、逐位可复现的对象，按自己的判据在名单里再挑一遍等于用未发表的判据
    替换已发表的判据。代价是 48 / 133885 = 0.036% 的数据。
    这是 modifiable_convention，不是 derived_criterion。

  # F7 的作用范围。**改这一行就能切换，后果已实测。**
  f7_scope: "all"          # all | identity_from_geometry_only
  f7_scope_note: >
    本仓索引每一行都带一列 qm9_identity_source。它的值是 relaxed 时，
    这一行的 qm9_smiles **本来就是从 B3LYP 几何解析出来的**，
    于是"几何与 SMILES 不一致"这件事**对我们不成立**。实测名单 3054 个的分布：
      relaxed 1749 | gdb17 1270 | none 35
    dsgdb9nsd_003838 属于 gdb17 那一类（relaxed SMILES 是 `[NH][C][N]C=O.N#N`，
    两个片段且带自由基，索引因此退回 GDB17 的 `N=C1N=CON=N1`，而几何是解离的）。

    "all"（当前值，用户 2026-09-02 要求）：3054 个全剔除。
      理由是上游把它们叫作"**未表征**" —— 分子身份未确立；
      对一个做同分异构反应的数据集，拿 OpenBabel 从几何猜的身份当分子身份，
      风险由我们承担。
      实测代价：全量过完 F0/F1/F3/F4/F5 的 122737 个 -> 120215 个，**少 2522 个（2.05%）**；
      编号 1-4000 段 3819 -> 3749，**少 70 个**。
      其中已经跑完 CREST 的有 11 个（3.43 核·小时）。

    "identity_from_geometry_only"：只剔除 qm9_identity_source != "relaxed" 的那些。
      **这一档才是"只剔除对我们真正不自洽的"**。若要用，把上面一行改成这个值即可。
      实测代价：全量 122737 -> 121598，**少 1139 个（0.93%）**；1-4000 段 3819 -> 3786，少 33 个。

    两档的实测对照（2026-09-02，脚本见断点）：
                                        1-4000 段          全量 133884
      不开 F7                            3819               122737
      f7_scope = "all"                   3749  (-70)        120215  (-2522, -2.05%)
      f7_scope = "identity_from_geometry_only"
                                         3786  (-33)        121598  (-1139, -0.93%)


  provenance:
    transcribed_from: "stage1-qm9-alchemical-reaction-energy/docs/02_data_ingestion-and-filtering.md §4.1"
    transcribed_on: "2026-08-28"
    note: "语义重写，不是代码复用。stage 0 有自己的实现 openqha/filters.py 与自己的测试。"
# ======================================================================================
# Branch A -- basin list criteria
# ======================================================================================
# MOVED to configs/conformers.yaml on 2026-09-04, and merged back in through the
# `include:` list at the top of this file. It is a MOVE, not a copy: `package1:` is
# defined in exactly one place, and openqha/config.py raises if two files define it.
#
# Everything measured in it went with it -- the four-arm SHAKE attribution, the
# refine=opt/sp comparison, the deduplication threshold sweep. Nothing was summarised
# away in the move.
# ======================================================================================

# --------------------------------------------------------------------------------------
# 包 2 —— Hessian 旁路与频率对标
# --------------------------------------------------------------------------------------
package2:
  fmax_hessian_eV_A: 0.0001          # numerical_tolerance：残余力污染曲率
  finite_difference_delta_A: 0.01    # modifiable_convention，收敛性已实测（D0-34）
  delta_scan_A: [0.005, 0.010, 0.020, 0.040]
  delta_scan_species: "dsgdb9nsd_000048"   # 氧杂环丁烷，有最软的环折叠模
  rigid_singular_tol: 1.0e-8         # numerical_tolerance：刚体向量组的秩判据
  rigid_overlap_threshold: 0.5       # derived_criterion：本征向量落在刚体子空间的比例
  reject_imaginary_frequencies: true # derived_criterion：进入求和的必须是真极小点
  qrrho_nu0_cm: 100.0                # literature_value：Grimme, Chem. Eur. J. 2012, 18, 9955
  # ---- 参考层级（2026-08-29 用户裁定：改走完整复合，不再直接算 CCSD(T)/cc-pVTZ）----
  # 依据 Allen 等, "Reactive Chemistry at Unrestricted Coupled Cluster Level"（式 1、式 2）。
  # 原文对**能量与力都**给了复合式；数值频率由力做有限差分，所以复合力式直接给出复合 Hessian。
  # 实测（丙酮 10 原子、ORCA 6.0.1、8 核，单次解析梯度，见 D0-73）：
  #   MP2/DZ 5 s | MP2/TZ 30 s | MP2/QZ 321 s | CCSD/DZ 65 s | CCSD(T)/DZ 326 s | CCSD/TZ 435 s
  #   对照 CCSD(T)/TZ > 7200 s 未完成；六分量临时文件合计 17 MB，对照 CCSD(T)/TZ 单次 144 GB。
  reference_level: "composite_TZstar_ccsd"
  reference_spin: "restricted"       # 本体系全是中性闭壳层平衡极小点（门 F4 保证），用 R 不用 U
  composite_recipes:
    smoke_mp2_dz:                    # **冒烟专用** —— 单项, 不是复合, 只为把流程跑通
      target: "MP2/cc-pVDZ 单点, 用于验证复合流水线的接线"
      terms:
        - [1, "MP2", "cc-pVDZ"]
      seconds_per_gradient_8core: 5
    # 每一项是 [系数, 方法, 基组]；力与 Hessian 按系数线性组合
    composite_TZstar_ccsd:           # **在用** —— 用 CCSD 增量把 CCSD(T)/DZ 修到 TZ
      target: "CCSD(T)/cc-pVTZ 的复合近似"
      terms:
        - [1, "CCSD(T)", "cc-pVDZ"]
        - [1, "CCSD", "cc-pVTZ"]
        - [-1, "CCSD", "cc-pVDZ"]
      seconds_per_gradient_8core: 826
    composite_TZstar_mp2:            # 更便宜、精度更低（原文图 S1c 对照的就是它）
      target: "CCSD(T)/cc-pVTZ 的复合近似，增量取自 MP2"
      terms:
        - [1, "CCSD(T)", "cc-pVDZ"]
        - [1, "MP2", "cc-pVTZ"]
        - [-1, "MP2", "cc-pVDZ"]
      seconds_per_gradient_8core: 361
    composite_QZstar:                # 原文式 1/式 2 的完整形式，目标是 QZ
      target: "CCSD(T)/cc-pVQZ 的复合近似"
      terms:
        - [1, "CCSD(T)", "cc-pVDZ"]
        - [1, "CCSD", "cc-pVTZ"]
        - [-1, "CCSD", "cc-pVDZ"]
        - [1, "MP2", "cc-pVQZ"]
        - [-1, "MP2", "cc-pVTZ"]
      seconds_per_gradient_8core: 1177
    # ---- 2026-08-29 用户裁定 E2 的精度: "MP2 DZ* -> QZ*" ----------------------------
    # 一条**只用 MP2 增量**的基组阶梯, 底座是 CCSD(T)/cc-pVDZ, 三级都从同一个项池组合:
    #   DZ      = CCSD(T)/DZ
    #   TZ*_mp2 = CCSD(T)/DZ + (MP2/TZ - MP2/DZ)
    #   QZ*_mp2 = CCSD(T)/DZ + (MP2/QZ - MP2/DZ)
    # **三级共用一个项池**(4 个单点: CCSD(T)/DZ, MP2/DZ, MP2/TZ, MP2/QZ),
    # 所以量出整条阶梯的代价 = 量出最高一级的代价, **中间两级是免费的**,
    # 于是"阶梯收敛了没有"从假设变成一个可读的数。
    dz_base:                         # 阶梯第 0 级: 不做任何基组修正
      target: "CCSD(T)/cc-pVDZ(阶梯底座, 非复合)"
      terms:
        - [1, "CCSD(T)", "cc-pVDZ"]
      seconds_per_gradient_8core: 326
    composite_QZstar_mp2:            # **E2 在用** —— MP2 增量一步修到 QZ
      target: "CCSD(T)/cc-pVQZ 的复合近似, 基组增量全部取自 MP2"
      terms:
        - [1, "CCSD(T)", "cc-pVDZ"]
        - [1, "MP2", "cc-pVQZ"]
        - [-1, "MP2", "cc-pVDZ"]
      seconds_per_gradient_8core: 652
    smoke_hf_dz:                     # **冒烟专用** —— 最便宜的一项, 只为验证阶梯的接线
      target: "HF/cc-pVDZ 单点, 约 1 秒"
      terms:
        - [1, "HF", "cc-pVDZ"]
      seconds_per_gradient_8core: 1
  # 一次跑出整条阶梯: 驱动脚本按**项池**求解, 公共单点只算一次
  recipe_ladders:
    smoke_hf_to_mp2:                 # **冒烟专用**: 两级, 共用 cc-pVDZ, 每个结构约 6 秒
      description: "验证项池/组合/阶梯/续跑的接线, 不产出任何有物理意义的数"
      recipes: ["smoke_hf_dz", "smoke_mp2_dz"]
      pool_seconds_per_structure_8core: 6
    mp2_dz_to_qz:
      description: "MP2 增量阶梯 DZ -> TZ* -> QZ*, 共用一个项池"
      recipes: ["dz_base", "composite_TZstar_mp2", "composite_QZstar_mp2"]
      pool_seconds_per_structure_8core: 682   # 326 + 5 + 30 + 321
  reference_level_rejected:
    - level: "r2SCAN-3c"
      reason: "用户 2026-08-28 裁定排除"
    - level: "CCSD(T)/cc-pVTZ 直接计算"
      reason: >
        实测不可负担：单次解析梯度 > 7200 秒未完成、临时文件 144 GB，
        61 次 x 7 个物种 >= 36 天。见 D0-66、D0-69、D0-73。


# --------------------------------------------------------------------------------------
# 包 3 —— 近临界气相的状态点（2026-08-31 加入）
# --------------------------------------------------------------------------------------
# **为什么需要它**：2026-08-31 用户裁定包 3 改走**真实多分子气相**，
#   并用「近临界/近饱和高密度气相 + 热力学外推」（方案甲）。
#   298.15 K 时本体系的饱和蒸气太稀（丙酮 0.0074 nm^-3，碰撞间隔约 368 ps），
#   所以必须在近临界温度模拟，再按 S(T2)=S(T1)+∫Cp/T dT 外推回 298.15 K。
#
# **数据来源**：`chemicals` 1.5.2（Caleb Bell），逐条方法名见下面的 tc_source。
#   **注意 cyclopropanol 的 Tc/Pc 是 JOBACK 基团贡献法的估计值，不是实验值。**
# **饱和蒸气压**：Lee–Kesler 对比关联式；**数密度按理想气体 n = P/kT，近饱和时偏低**
#   （真实 Z < 1，故这是下限）。生产时应以模拟的位力压力回校。
# 生成脚本：`scripts/_superseded/branch1-archived/s0_species_critical_constants.py`
#   产物：`analysis/species_critical_constants.json`
package3_state_points:
  reference_reduced_temperature: 0.886   # modifiable_convention：参考文献近临界气相常用点
