# stage 0 production configuration -- **the single source of truth in this repository**
#
# Since 2026-08-28 stage 0 is an **independent open-source framework** that will be
# pushed to GitHub on its own. It therefore **reads nothing from stage 1 / stage 2 any
# more**: the edge set, the species table, symmetry numbers, parameters and data paths
# are all rewritten here. Anything copied from elsewhere records its origin and the date
# it was copied under `provenance`, plus a checksum, so that later drift is detected
# rather than inherited.
#
# Parameters carry the same five classes as stage 1 / stage 2
# (see .mem/skills/skill_stage0-standards.md section 1.4):
#   physical_constant | derived_criterion | literature_value | modifiable_convention
#   | numerical_tolerance | resource_budget

include:
  # Sections that live in their own files. Resolved relative to this file,
  # one level deep, and a key defined twice is an error rather than a race.
  - conformers.yaml          # branch A: crest:, package1:
  - edges_testset.yaml       # this project's own campaign: edges:, species:
  - filters.yaml             # species_filter
  - hessian.yaml             # package2
  - branchB_protocol.yaml    # branch B: how long, how often (the published protocol)
  - state_points.yaml        # package3_state_points
  - electronic.yaml          # package5
  - cluster_tianhe.yaml      # cluster

meta:
  name: "stage0-production"
  description: "The control without alchemy: conformers -> dynamics -> density of states -> coupled-cluster single points"
  written: "2026-08-28"

# --------------------------------------------------------------------------------------
# Where a run lands -- **the one root this repository writes under on any machine**
# --------------------------------------------------------------------------------------
# User ruling 2026-08-31, verbatim: "do not put things directly under ~, there are too
# many files in /home; move it to \wsl.localhost\Ubuntu-24.04\home\ubuntu\runs\openQHA"
# (that is, /home/ubuntu/runs/openQHA).
#
# **Why the heavy work does not go on /mnt/c**: CREST writes many small files into
# parallel `_N` subdirectories, and doing that across 9p (the Windows mount) is
# I/O-bound. Products are copied back into the repository once computed -- the result is
# copied, not the process.
#
# Directory convention (all derived by openqha.config.runs_dir(); no literal path appears
# in a script any more):
#   crest_batch/  CREST working directories for the package 1 batch
#   crest_work/   single-species experiments
#   build/        the CREST build tree           verify/  patch verification
#   sockets/      sockets and logs of the resident MACE server
#   logs/         driver logs
#   legacy/       the old directories scattered under ~ before 2026-08-31
#   tmp/          temporary
runtime:
  runs_root: "~/runs/openQHA"        # resource_budget; overridable by S0_RUNS_ROOT
  # `~/crest_build` is now a **symbolic link** to runs_root/build/crest_build.
  # The only reason it is kept: the RUNPATH of build-patched/crest has the absolute path
  # `/home/ubuntu/crest_build/lib` burned into it, so deleting the link leaves that
  # binary unable to find its own .so.
  legacy_symlink_note: "~/crest_build -> runs_root/build/crest_build (RUNPATH is absolute)"

# --------------------------------------------------------------------------------------
# Thermodynamic state
# --------------------------------------------------------------------------------------
thermodynamics:
  temperature_K: 298.15          # modifiable_convention: the target state; changing the temperature means changing the whole chain
  pressure_Pa: 100000.0          # modifiable_convention: the 1 bar standard state
  target_accuracy_kcal: 1.0      # derived_criterion: the scale every approximation is judged against

# --------------------------------------------------------------------------------------
# The potential -- there is only one
# --------------------------------------------------------------------------------------
engine:
  # ALIGNED 2026-09-09. This said "MACE-OFF23-SC" while DEFAULT_ENGINE in
  # openqha/potentials/engine.py has been MACE-OFF23_medium since 2026-09-03 (S0-A-16).
  # **They disagreed, and the code won**: no code reads this `name` field, it is a
  # record. So the potential this file claimed was not the potential being run, and
  # anyone reproducing from the config would have reported the wrong level. It now
  # follows the code. To change potentials use S0_ENGINE -- the only switch read.
  name: "MACE-OFF23_medium"
  # PATH IS NOT AUTHORITATIVE HERE. openqha/potentials/engine.py resolves
  # `model_root()/<filename>` and nothing else. This line records WHICH weights, not where.
  # Weights go FLAT in data/potentials/, keeping their own filename, with NO
  # subdirectory (ruling 2026-09-09). S0_MACE_ROOT moves the whole directory;
  # S0_MACE_MODEL overrides one file.
  weights: "data/potentials/MACE-OFF23_medium.model"
  dtype: "float64"                  # numerical_tolerance: geometry optimisation and finite-difference Hessians both need it
  device: "cpu"
  source: "https://arxiv.org/abs/2312.15211"
  # A missing weight file **raises; it never falls back to another potential**.
  # That is about the file being absent -- nothing inspects what is inside it.
  fallback_allowed: false
  # Still selectable, and must stay: every package-1 basin and every number in
  # D0-P2-11/12/14 lives on that surface and cannot be reproduced without it.
  # Select it back with S0_ENGINE=MACE-OFF23-SC.
  #   superseded_default: "MACE-OFF23-SC"  (arXiv 2405.18171)

# --------------------------------------------------------------------------------------
# Data -- local paths, pointing at no other stage
# --------------------------------------------------------------------------------------
# The raw QM9 data is large (index 119 MB, geometries 224 MB) and **is not in git**.
# Put it under data/ with `python scripts/tooling/s0_prepare_data.py --from <a QM9 dir>`,
# or set S0_QM9_ROOT to point elsewhere.
# Only the reference geometries of the 7 target species are **distributed with the
# repository** (7 files, a few kB), so that stage 0's core deliverable (package 2) is
# reproducible with no external data at all.
data:
  qm9_root: "data/qm9"                       # relative to the repository root; overridable by S0_QM9_ROOT
  qm9_index_csv: "index_Chem_composition.csv"
  qm9_xyz_dir: "xyz_files"
  # curatedQM9: repaired geometries for the molecules QM9 could not characterise.
  # Senthil, Chakraborty & Ramakrishnan, Chem. Sci. 2021, 12, 5566 (10.1039/D0SC05591C).
  # Unpack the archive under data/qm9/ ; S0_CURATED_QM9 overrides the location.
  # Measured on the 133 661 files present -- the archive uses THREE naming patterns:
  #     dsgdb9nsd_XXXXXX.xyz        130 831   untouched QM9 originals
  #     dsgdb9nsd_XXXXXX_new.xyz      1 257   repaired, QM9-style tag
  #     dsgdb9_XXXXXX_new.xyz         1 573   repaired, short tag
  # A lookup assuming one pattern would silently miss most of the repairs.
  curated_qm9_dir: "133660_curatedQM9_outof_133885"
  # The same archive as ONE file (ticket 17): scripts/tooling/s0_pack_curated_qm9.py writes
  # one group per molecule (geometry, charges, frequencies, SMILES, InChI, the file's text)
  # into data/qm9/curated_qm9.h5; a molecule is extracted on demand when the directory is
  # absent (a cluster). S0_CURATED_QM9_H5 overrides.
  curated_qm9_h5: "curated_qm9.h5"
  vendored_reference_geometries: "data/reference-geometries"   # the 7 distributed with the repository
  # The released MACE-OFF23 training data (ticket 30): is a molecule in the potential's
  # training set? The two SPICE-derived extxyz files (5.2 GB) are NOT in git; declare
  # where they are (or set S0_TRAINING_SETS_ROOT). The index built from them
  # (data/training_sets/mace-off23_spice_index.dat, ~3 MB) is in the repository, so the
  # question can be answered without the files.
  training_sets:
    mace_off23:
      root: "data/training_sets/mace-off23_spice"     # holds the two files below; S0_TRAINING_SETS_ROOT overrides
      train_file: "train_large_neut_no_bad_clean.xyz"  # 951,005 frames, 17,132 molecules
      test_file: "test_large_neut_all.xyz"             # 50,195 frames; split by frame, not by molecule
      doi: "10.17863/CAM.107498"                       # Moore et al., Apollo, research data supporting MACE-OFF23
      cache_dir: "data/training_sets"
  upstream:
    dataset: "QM9 (GDB-9), Ramakrishnan et al., Sci. Data 2014, 1, 140022"
    note: >
      The columns of the index table (rotational constants A/B/C, all 3N-6 harmonic
      frequencies, zpve, U0/U/H/G, Cv) are the native B3LYP/6-31G(2df,p) values.
      stage 0 treats them only as a **free control**, never as a reference level.
