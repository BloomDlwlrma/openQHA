# openQHA -- Package 5: the electronic term. RECORD ONLY -- no code reads this section.
#
# Split out of configs/openqha.yaml on 2026-09-04: that file
# now holds ONLY global configuration and the `include:` index. This is a
# MOVE, not a copy -- openqha/config.py raises if two files define the same
# key -- and it was moved by byte range, so every comment and every measured
# number came with it verbatim.
# ======================================================================

  # **Two problems that must stay visible** (measured 2026-08-31):
  # 1. acetamide Tc = 761 K, N-methylformamide Tc = 725 K; at Tr = 0.886 those are
  #    674 K and 642 K, an **extrapolation span of 344-376 K**, while the five C3H6O
  #    species span only 130-185 K.
  #    MACE-OFF23-SC's training distribution also holds almost no 674 K configurations
  #    -- **thermal stability is in doubt**.
  #    **The only four-element edge, C2H5O1N1_19_36, is exactly these two species; this
  #    is not a corner case.**
  # 2. The critical constants of cyclopropanol are a group-contribution estimate,
  #    **not an experimental value**, and the error is unknown.

# --------------------------------------------------------------------------------------
# Package 5 -- the electronic term
# --------------------------------------------------------------------------------------
package5:
  # 2026-09-09: the half after `//` follows DEFAULT_ENGINE from MACE-OFF23-SC to
  # MACE-OFF23_medium. Production records COMPUTE this string via
  # engine.composite_notation() (which reads engine_name()), so the products were always
  # right; this hand-written line is what disagreed with them.
  composite_notation: "DLPNO-CCSD(T)/cc-pVTZ // MACE-OFF23_medium"
  orca_version: "6.1.1"              # the conda environment orca611 on deimos
  orca_env_script: "configs/env_orca611_tianhe.sh"
  run_location: "deimos only"        # **WSL is for testing only; it produces no production number**
  supersedes: "the 5.0.4 version lock -- digit-for-digit comparability with the hkuhpc batch is given up here"
  keyword_line: "! DLPNO-CCSD(T) cc-pVTZ cc-pVTZ/JK RIJK cc-pVTZ/C"
  tcut_pairs: "1e-6"
  loc_method: "AHFB"
  maxcore_mb: 3900                   # resource_budget: rewritten at run time by the cluster script
  nprocs: 4                          # resource_budget: likewise
  level_consistency_bound_kcal: 0.05 # modifiable_convention: 5% of the 1.0 target
