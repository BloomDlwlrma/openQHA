# 02d-2 on TianheXY-AI (a100x / h100x): the same rows as array.conf, packed differently.
#
#     bash examples/02d-2_qha_settings_array/submit_array.sh --plan examples/02d-2_qha_settings_array/array_ai.conf
#     bash examples/02d-2_qha_settings_array/submit_array.sh        examples/02d-2_qha_settings_array/array_ai.conf
#
# WHY A SEPARATE CONF AND NOT array.conf WITH TWO VARIABLES CHANGED
# ---------------------------------------------------------------
# * TianheXY-AI allocates PER CARD and the allocation is one card by default; a task
#   asking for 8 cards on a100x is a different kind of request from one on `ai`. One row
#   per task keeps every task the size this cluster hands out. 9 rows -> 9 tasks, and
#   MaxSubmit (10 on this account) still admits the array with one job to spare.
# * The walltime is 24 h (hpc/resource_configs/tianhe_ai.py QHA_WALLTIME), not 36 h.
#   The three p1500 rows need ~25 h at the rate measured on an113 (59 s/ps with three
#   dense trajectories on one A100) and will stop on the wall budget with their frames
#   flushed; resubmitting the same command RESUMES them (s0_B_qha_trajectory_openmm.py
#   already_complete / frames.npy).
# * The rate to plan with is the a100x one above, not the an45 A800 figure in array.conf.
#
# Tags are 02d2_<NAME>, basins come from 02d_prod -- identical to array.conf, so a row
# finished on either cluster is the same product.
SPECIES=dsgdb9nsd_000018
BASIN_TAG=02d_prod
TAG_PREFIX=02d2
SETTINGS=examples/02d-2_qha_settings_array/settings.tsv
GPUS_PER_JOB=1
WALLTIME=24:00:00
