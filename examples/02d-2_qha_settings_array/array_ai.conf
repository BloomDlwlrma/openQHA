# 02d-2 on TianheXY-AI (a100x / h100x): the same rows as array.conf, packed differently.
#
#     bash examples/02d-2_qha_settings_array/submit_array.sh --plan examples/02d-2_qha_settings_array/array_ai.conf
#     bash examples/02d-2_qha_settings_array/submit_array.sh        examples/02d-2_qha_settings_array/array_ai.conf
#
# WHY A SEPARATE CONF AND NOT array.conf WITH TWO VARIABLES CHANGED
# ---------------------------------------------------------------
# * TianheXY-AI allocates PER CARD, and its job quota is 6 submitted / 6 running (the
#   account page, 2026-09-13) -- a 9-task array would be refused. With one trajectory
#   per basin, each row is ONE worker, so the 12 CPUs of an a100x card
#   take all 9 rows: submit_array.sh packs R = 12 / 1 -> 9 rows on one card, ONE task.
#   GPUS_PER_JOB=1 keeps that task the size this cluster hands out.
# * The walltime is 72 h (user, 2026-09-13). The three p1500 rows need ~25 h at the rate
#   measured on an113 with THREE dense trajectories on one A100 (59 s/ps); with nine on
#   the card the per-trajectory rate is unmeasured and slower, and 72 h is the margin
#   for that. A row that still runs out stops on the wall budget with its frames flushed
#   and RESUMES on resubmission of the same command (already_complete / frames.npy).
# * The rate to plan with is the a100x one above, not the an45 A800 figure in array.conf.
#
# Tags are 02d2_<NAME>, basins come from 02d_prod -- identical to array.conf, so a row
# finished on either cluster is the same product.
SPECIES=dsgdb9nsd_000018
BASIN_TAG=02d_prod
TAG_PREFIX=02d2
SETTINGS=examples/02d-2_qha_settings_array/settings.tsv
GPUS_PER_JOB=1
WALLTIME=72:00:00
