# 02d-2: what is common to every row of settings.tsv. Sourced by submit_array.sh on the
# login node (to plan and generate) and by array.slurm in the job (to run).
#
#     source /APP/u22/ai_x86/toolshs/set-XY-I.sh
#     bash examples/02d-2_qha_settings_array/submit_array.sh              # plan + submit
#     bash examples/02d-2_qha_settings_array/submit_array.sh --plan       # plan only
# =======================================================================================

# --- the molecule, and where its basins are -------------------------------------------
# Every row reads branch A's product from BASIN_TAG (made once, by
# examples/02d_qha_frequency_identity/branchA.conf on deimos) and writes its own
# trajectories and report under 02d2_<NAME>. One branch A, many branch Bs.
SPECIES=dsgdb9nsd_000018
BASIN_TAG=02d_prod
TAG_PREFIX=02d2

# --- the rows -----------------------------------------------------------------------------
SETTINGS=examples/02d-2_qha_settings_array/settings.tsv

# --- cards per array task ---------------------------------------------------------------
# One row = one card (12 CPUs, 120 GB; 3 seeds x 1 basin = 3 workers, 9 CPUs idle and no
# cheaper request exists). A node has 8 cards, so up to 8 rows share one array task and
# run concurrently, one per card. submit_array.sh sets G = ceil(N / ceil(N / 8)) so the
# tasks are balanced (9 rows -> 2 tasks of 5 and 4, not 8 and 1).
#
# WHY NOT ONE ARRAY TASK PER ROW: MaxSubmit is 10 on this account (measured 2026-09-11),
# and every array element counts. 9 single-card tasks would leave room for one other
# job; 27 would be refused. Packing rows into cards keeps the array short.
GPUS_PER_JOB=8

# --- walltime ----------------------------------------------------------------------------
# The longest row bounds the task. 1500 ps at ~100 s/ps (measured, CPU) is ~42 h; on an
# A800 it is unmeasured and probably much less. 3 days is a ceiling, not an estimate.
WALLTIME=3-00:00:00
