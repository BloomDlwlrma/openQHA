# 02d-2, the 30-minute version of the array.
#
# Two ways to use it. AS AN ARRAY, from the login node -- this is what tests the array
# path itself (submit_array.sh's arithmetic, array.slurm's per-card launch):
#
#     source /APP/u22/ai_x86/toolshs/set-XY-I.sh
#     bash examples/02d-2_qha_settings_array/submit_array.sh --plan examples/02d-2_qha_settings_array/array_t30.conf
#     bash examples/02d-2_qha_settings_array/submit_array.sh        examples/02d-2_qha_settings_array/array_t30.conf
#
# BY HAND, on a compute node -- this is what tests one row where you can watch it:
#
#     bash examples/02d-2_qha_settings_array/submit_array.sh --plan examples/02d-2_qha_settings_array/array_t30.conf
#         # --plan still WRITES generated/<NAME>.conf for every row; it only skips the submit
#     bash hpc/tools/gpu_shell.sh 1 02:00:00
#     conda activate openqha-gpu
#     bash hpc/tools/test30.sh examples/02d-2_qha_settings_array/generated/t5_s2.conf
#
# Tags are 02d2t30_<NAME>, basins come from 02d_prod. Delete analysis/qha/02d2t30_*/ after.
SPECIES=dsgdb9nsd_000018
BASIN_TAG=02d_prod
TAG_PREFIX=02d2t30
SETTINGS=examples/02d-2_qha_settings_array/settings_t30.tsv
GPUS_PER_JOB=1
WALLTIME=00:30:00
