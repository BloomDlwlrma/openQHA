# 02c at PRODUCTION level -- MACE-OFF vs GFN2-xTB vs RI-MP2/RIJK/cc-pVTZ
#
#     bash examples/run_chain.sh examples/02c_hessian_benchmark_levels/chain.conf deimos
#
# **CPU partitions only.** ORCA has no GPU path in this repository, and D0-75 puts
# production quantum chemistry on deimos. `run_chain.sh` refuses a GPU partition for this
# chain on the login node rather than letting the allocation be wasted in the queue.
# =======================================================================================

CHAIN=levels

SPECIES=dsgdb9nsd_000018
TAG=02c_prod

# --- the three levels --------------------------------------------------------------------
# Drop `rimp2` to get the MACE/GFN2 comparison in under a second; the reference level is
# what makes this a benchmark rather than a curiosity.
LEVELS=mace,gfn2,rimp2

# --- ORCA ---------------------------------------------------------------------------------
# Cost measured in this repository: 1613 s per 10-atom structure at 4 processes, 3360 s at
# 15 atoms (analysis/branch2_cost_model.json). One job per basin, run in sequence, so a
# three-basin molecule is about 1.5 hours at these settings.
#
# `maxcore` is PER PROCESS. 3500 MB x 8 = 28 GB, which fits a deimos node; raising nprocs
# without lowering maxcore is the usual way to get an out-of-memory kill an hour in.
ORCA_NPROCS=8
ORCA_MAXCORE=3500
THREADS=8

# --- what is deliberately NOT set here ------------------------------------------------------
# The route line. It lives in scripts/production/s0_branch2_opt_freq.py, and
# `assert_route_matches_production()` reads it back out of that file and refuses to run if
# the two have drifted. Two copies of a route line is one copy too many.
