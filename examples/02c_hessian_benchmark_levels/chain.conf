# 02c at PRODUCTION level -- MACE-OFF vs GFN2-xTB vs RI-MP2/RIJK/cc-pVTZ
#
#     bash examples/run_chain.sh examples/02c_hessian_benchmark_levels/chain.conf deimos
#
# **CPU partitions only.** ORCA has no GPU path in this repository, and production
# quantum chemistry runs on deimos. `run_chain.sh` refuses a GPU partition for this
# chain on the login node rather than letting the allocation be wasted in the queue.
# =======================================================================================

CHAIN=levels

SPECIES=dsgdb9nsd_000018
TAG=02c_prod

# --- the three levels --------------------------------------------------------------------
# Drop `rimp2` to get the MACE/GFN2 comparison in under a second; the reference level is
# what makes this a benchmark rather than a curiosity.
LEVELS=mace,gfn2,rimp2

# --- ORCA ---------------------------------------------------------------------------------
# **Four processes per molecule**. Rendered into the input as
#     %pal nprocs 4 end
# by scripts/production/s0_branch2_opt_freq.py::write_input, which is ORCA's own way of
# asking for MPI parallelism (ORCA manual, "Parallel calculations"); ORCA launches the
# processes itself, so there is no `srun` and `--ntasks` stays 1. The cost model was
# measured at exactly this count: 1613 s per 10-atom structure, 3360 s at 15 atoms
# (analysis/branch2_cost_model.json). One job per basin, in sequence.
#
# `maxcore` is PER PROCESS: 3500 MB x 4 = 14 GB. deimos hands over the whole 64-core
# node regardless, so four here is about matching the measured cost model and leaving
# the other 60 cores to other molecules in the same job, not about saving cores.
ORCA_NPROCS=4
ORCA_MAXCORE=3500
THREADS=4

# --- what is deliberately NOT set here ------------------------------------------------------
# The route line. It lives in scripts/production/s0_branch2_opt_freq.py, and
# `assert_route_matches_production()` reads it back out of that file and refuses to run if
# the two have drifted. Two copies of a route line is one copy too many.
