# 02c, the QUICK half: MACE-OFF vs GFN2-xTB only. Seconds of compute, so it goes to the
# 30-minute CPU queue rather than to a login node.
#
#     bash examples/run_chain.sh examples/02c_hessian_benchmark_levels/quick.conf debug
#
# Same tag as chain.conf and branchA.conf here (02c_prod), so it reads the same basins and
# writes into the same analysis/levels/02c_prod/ record; running chain.conf afterwards
# adds the RI-MP2 column to it. Drop nothing else: the ORCA lines below are unused without
# `rimp2` in LEVELS and are kept so the two confs differ in exactly one line.
# =======================================================================================

CHAIN=levels
SPECIES=dsgdb9nsd_000018
TAG=02c_prod

LEVELS=mace,gfn2

ORCA_NPROCS=4
ORCA_MAXCORE=3500
THREADS=4
