# PROPANAL, step 1. Same tag as branchA.conf (02c_prod), so the two molecules' basins sit
# side by side under it. This is a separate FILE and not `SPECIES=... bash run_chain.sh
# branchA.conf`, because a conf's plain assignments override the shell when sourced;
# run_chain.sh now refuses that form outright (2026-09-11).
#
#     bash examples/run_chain.sh examples/02c_hessian_benchmark_levels/branchA-propanal.conf deimos
#
#
#     bash examples/run_chain.sh examples/02c_hessian_benchmark_levels/branchA.conf deimos   # step 1
#     bash examples/run_chain.sh examples/02c_hessian_benchmark_levels/chain.conf deimos   # step 2
#
# **02c is the one example whose BOTH steps are CPU jobs.** Its step 2 is ORCA RI-MP2,
# which has no GPU path here and by D0-75 runs on deimos. The two steps are still kept
# apart, for a reason that has nothing to do with hardware: branch A takes minutes and
# step 2 takes hours, and a chain that redoes the cheap half every time you re-run the
# expensive half wastes nothing but hides which half you were actually changing.
#
# **TAG matches chain.conf's** (`02c_prod`) -- the basin store is keyed by (species, tag).

CHAIN=conformers

SPECIES=dsgdb9nsd_000035        # propanal, CCC=O, 3 basins. Acetone: branchA.conf
TAG=02c_prod

# 8 here, matching chain.conf, so both steps of 02c describe the same node occupancy.
THREADS=4
SEEDS=3
