# 02b, the 30-minute version: the whole qha chain on a compute node, by hand.
#
#     source /APP/u22/ai_x86/toolshs/set-XY-I.sh
#     bash hpc/tools/gpu_shell.sh 1 02:00:00          # a card for two hours of debugging
#     conda activate openqha-gpu
#     bash hpc/tools/test30.sh examples/02b_qha_openmm_propanal/test30.conf
#
# WHAT MAKES IT SHORT.  EQUIL 1 ps + PROD 5 ps = 6 000 steps per trajectory; at the
# measured ~60 ms/step (12 workers sharing an A800) that is ~6 min, and the 3 seeds x
# basins all run at once. The CPU-side minimisation in relax() adds up to ~200 s per
# basin. Expect 10-15 min end to end, most of it not the dynamics.
#
# WHAT MAKES IT SAFE.  TAG is NOT `propanal`. The trajectory driver RESUMES from whatever
# frames it finds under its tag, so 5 ps written under the production tag would become
# the first 5 ps of the production run. This test writes under `propanal_t30` and reads
# branch A's basins from BASIN_TAG=propanal, so nothing it produces can be mistaken for,
# or appended to, a production number. Delete analysis/qha/propanal_t30/ when done.
#
# WHAT IT DOES NOT TEST.  Whether 5 ps is enough for a quasi-harmonic entropy -- it is
# not, and collect will say so in its numbers. This exercises the chain, not the science.
CHAIN=qha
SPECIES=dsgdb9nsd_000035        # propanal, CCC=O, 10 atoms, sigma 1
TAG=propanal_t30
BASIN_TAG=propanal
SEEDS=1        # one per basin; 2+ = blank control
EQUIL_PS=1
PROD_PS=5
THREADS=4
