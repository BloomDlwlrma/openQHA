# STEP 1 of 2 -- branch A only, on the CPU cluster. Propanal.
#
#     bash examples/run_chain.sh examples/02b_qha_openmm_propanal/branchA.conf deimos   # step 1, CPU
#     bash examples/run_chain.sh examples/02b_qha_openmm_propanal/chain.conf ai   # step 2, GPU
#
# **TAG must match chain.conf's**, and it does (`propanal`). The basin store is keyed by
# (species, tag): step 2 looks there, finds these basins and skips branch A entirely. A
# different tag in the two files would send step 2 looking somewhere empty, and on a GPU
# partition it would then refuse -- correctly, but for a confusing reason.
#
# =======================================================================================
# WHY PROPANAL IS THE ONE TO ESTABLISH FIRST
# =======================================================================================
# Branch A, measured 2026-09-08 (240.1 s, 9/9 acceptance criteria):
#
#     CREST reports 3 conformers; + 1 reference geometry = 4 frames in -> 3 basins
#     basin 0   0.0000 kcal   Cs   nu_min 128.44
#     basin 1   0.8360 kcal   C1   nu_min  73.99   } a degenerate gauche PAIR,
#     basin 2   0.8360 kcal   C1   nu_min  73.96   } each other's mirror image
#
# The identical energies are a free check on the search: a run that found only one of the
# pair is visibly wrong. **Read them when this job finishes, before spending GPU time.**
# =======================================================================================

CHAIN=conformers

SPECIES=dsgdb9nsd_000035        # propanal, CCC=O, 10 atoms, sigma 1
TAG=propanal

# 4 threads is the condition the 285 s/species figure was measured under, so a run at
# this setting is comparable with the record. For many species use the branch A Parsl
# driver instead -- that is what the 16 workers x 4 threads layout in
# hpc/resource_configs/tianhe_cpu.py exists for.
THREADS=4

# =======================================================================================
# DIAGNOSTICS -- the two that observe, and deliberately NOT the one that judges
# =======================================================================================
# This is the run that shares a node-local layout with 02a-2 and goes in at the same time,
# so the pair also answers a question checkpoint 3 left open: **do two concurrent jobs
# still collide?** They used to share one socket path on the shared filesystem
# (2026-09-09); sockets now live at /tmp/<owner>/<job id>/sockets/, and two jobs at once
# is the only way to find out whether that is true.
#
# Propanal is also the molecule that produced the 1814-conformer NaN ensemble in job
# 7347197, so it is the one whose trace matters most.
KEEP_CALCSPACE=mace_calcspace
MACE_TRACE=1

# **NO MAX_CONFORMERS here, on purpose.** A conformer ceiling is a claim about a specific
# molecule -- acetone has one C-C-C-O torsion and two methyl rotors, and its verified
# count is 7, so 100 is a cliff nothing legitimate approaches. Propanal has an extra
# rotatable bond and no such verified count, and a ceiling guessed for it could abort a
# correct run. The energy check in openqha/conformer_search/crest.py::judge_energies
# applies here regardless: it tests whether the numbers are well formed, which is a
# property of the calculation and not of the molecule.
SEEDS=1        # one per basin (ruling 2026-09-13); 2+ = blank control
