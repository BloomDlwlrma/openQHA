# STEP 1 of 2 -- branch A only, on the CPU cluster. Propanal.
#
#     MODE=hpc PARTITION=deimos bash examples/run_chain.sh \
#         examples/02b_qha_openmm_propanal/branchA.conf          # step 1, CPU
#     MODE=hpc PARTITION=ai     bash examples/run_chain.sh \
#         examples/02b_qha_openmm_propanal/chain.conf            # step 2, GPU
#
# **TAG must match chain.conf's**, and it does (`propanal`). The basin store is keyed by
# (species, tag): step 2 looks there, finds these basins and skips branch A entirely. A
# different tag in the two files would send step 2 looking somewhere empty, and on a GPU
# partition it would then refuse -- correctly, but for a confusing reason.
#
# =======================================================================================
# WHY PROPANAL IS THE ONE TO ESTABLISH FIRST
# =======================================================================================
# Branch A, measured 2026-09-08 (240.1 s, 9/9 acceptance criteria):
#
#     CREST reports 3 conformers; + 1 reference geometry = 4 frames in -> 3 basins
#     basin 0   0.0000 kcal   Cs   nu_min 128.44
#     basin 1   0.8360 kcal   C1   nu_min  73.99   } a degenerate gauche PAIR,
#     basin 2   0.8360 kcal   C1   nu_min  73.96   } each other's mirror image
#
# The identical energies are a free check on the search: a run that found only one of the
# pair is visibly wrong. **Read them when this job finishes, before spending GPU time.**
# =======================================================================================

CHAIN=conformers

SPECIES=dsgdb9nsd_000035        # propanal, CCC=O, 10 atoms, sigma 1
TAG=propanal

# 4 threads is the condition the 285 s/species figure was measured under, so a run at
# this setting is comparable with the record. For many species use the branch A Parsl
# driver instead -- that is what the 16 workers x 4 threads layout in
# hpc/resource_configs/tianhe_cpu.py exists for.
THREADS=4
SEEDS=3
