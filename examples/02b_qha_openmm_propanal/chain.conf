#!/bin/bash
# openQHA whole chain -- propanal (dsgdb9nsd_000035). A MULTI-BASIN molecule.
#
#     bash examples/run_chain.sh examples/02b_qha_openmm_propanal/chain.conf
#     MODE=hpc PARTITION=ai    bash examples/run_chain.sh examples/02b_qha_openmm_propanal/chain.conf
#     MODE=hpc PARTITION=h100x bash examples/run_chain.sh examples/02b_qha_openmm_propanal/chain.conf
#
# Sourced by `examples/run_chain.sh`, in both modes. The job receives this path as its
# argument and sources it too -- there is no `--export`, so what the run used is this
# file and not the environment of whichever shell submitted it.
#
# =======================================================================================
# WHY PROPANAL, AND NOT ACETONE
# =======================================================================================
# Branch A, measured 2026-09-08 (240.1 s, 9/9 acceptance criteria):
#
#     CREST reports 3 conformers; + 1 reference geometry = 4 frames in -> 3 basins
#
#     basin        E / eV      rel/kcal  sigma   pg   nu_min/cm-1   G-Eel/kcal
#         0  -5259.188956        0.0000      1   Cs        128.44      36.0252
#         1  -5259.152703        0.8360      1   C1         73.99      35.7700
#         2  -5259.152703        0.8360      1   C1         73.96      35.7699
#
# That is the textbook propanal surface: one Cs (syn) minimum and a DEGENERATE PAIR of
# gauche minima, which are each other's mirror image -- hence the identical energies, and
# a free check on the search (a run that found only one of them would be wrong in a way
# the energies would show).
#
# **Acetone has ONE basin** (measured the same way, 2026-09-07). So on acetone
#
#     F_conf = -kT ln sum_i exp(-dG_i / kT)
#
# is identically zero and cannot say anything about any setting. Propanal is the smallest
# molecule in this project's own edge set where the ensemble is real -- and it is
# acetone's partner in edge C3H6O1N0_18_35, so it is not a toy chosen for convenience.
#
# From the electronic energies alone, F_conf would be -0.2354 kcal/mol. The point of the
# chain is what T*S does to that.
# =======================================================================================

export SPECIES="${SPECIES:-dsgdb9nsd_000035}"       # propanal, CCC=O, 10 atoms, sigma 1
export TAG="${TAG:-propanal}"

# Independent trajectories per basin. THREE is the minimum that gives a blank control --
# the seed-to-seed spread is branch B acceptance criterion 5, and with fewer there is
# nothing to compare a difference against.
export SEEDS="${SEEDS:-3}"

# CREST threads for branch A. 4 is the condition the 285 s/species cost was measured
# under; changing it invalidates that number.
export THREADS="${THREADS:-4}"

# Length, sampling interval and thermostat are NOT here. They are the PROTOCOL and live
# in configs/branchB_protocol.yaml, which both trajectory routes and the Parsl driver
# read. A per-example override would be exactly the drift that file exists to prevent.

# ---- mode -------------------------------------------------------------------------------
# local | hpc. Overridden from the command line: `MODE=hpc PARTITION=ai bash ...`
export MODE="${MODE:-local}"
export PARTITION="${PARTITION:-ai}"     # hpc only: ai (TianheXY-A) | h100x (TianheXY-AI)

# The collection pass is CPU work -- it reads frames and diagonalises a 3N x 3N
# covariance. On a cluster it belongs on TianheXY-C, not on the card that made the
# trajectories.
export COLLECT_RESOURCE="${COLLECT_RESOURCE:-}"     # empty -> same as the trajectories
