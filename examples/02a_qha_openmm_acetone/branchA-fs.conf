# Branch A ONLY, acetone, **on the shared filesystem instead of node-local scratch**.
# This is run 02a-1.
#
#     bash examples/run_chain.sh examples/02a_qha_openmm_acetone/branchA-fs.conf deimos
#
# =======================================================================================
# WHY THIS FILE EXISTS, AND HOW IT DIFFERS FROM branchA.conf
# =======================================================================================
# One difference and one only: **where the work is written**.
#
#     branchA-fs.conf  (02a-1)   $HOME/runs/openQHA        shared filesystem, Lustre
#     branchA.conf     (02a-2)   /tmp/<owner>/<job id>/    node-local
#
# Everything else -- species, threads, diagnostics, ceiling -- is identical on purpose,
# so the two runs are comparable and any difference between them is the filesystem.
#
# Two reasons to run this one first:
#
#   1. **The node-local path has never completed a branch A run.** It was written on
#      2026-09-09, and until that day it had never taken effect at all (hpc/env/common.sh
#      set S0_RUNS_ROOT before hpc/env/tianhe.sh could move it, so every earlier run wrote
#      to Lustre while the documentation said otherwise). Running the OLD, known shape
#      first separates "the diagnosis works" from "the new scratch layout works".
#   2. If the job is killed or the copy-back fails, the work is **already** on a
#      filesystem that survives. Node-local storage is gone when the job ends unless
#      chain_body.sh carries it back.
#
# The cost is the one this project measured and dislikes: CREST writes many small files
# into parallel `_N` subdirectories, and doing that on Lustre is slow for this job and for
# everyone else on the machine. **That cost is accepted here** -- this is a run to watch,
# not a campaign, and losing the evidence would be worse than being slow.
# =======================================================================================

CHAIN=conformers

SPECIES=dsgdb9nsd_000018        # acetone, CC(=O)C, 10 atoms, sigma 2

# A TAG OF ITS OWN, and this is not cosmetic. The branch A product is keyed by
# (SPECIES, TAG), so if this run and 02a-2 shared a tag the second to finish would
# overwrite the first and the comparison would be gone. `acetone` stays the canonical
# tag, produced by branchA.conf, and consumed by 02a's GPU chain.
TAG=acetone_fs

THREADS=4

# ---- the one line that makes this the filesystem run ----------------------------------
# `chain_body.sh` sources this conf BEFORE hpc/env/common.sh and hpc/env/tianhe.sh
# (line 37 against lines 119-120), and both of those move the runs root only when nobody
# has chosen one: common.sh sets its default and marks it S0_RUNS_ROOT_IS_DEFAULT, and
# tianhe.sh redirects to node-local scratch only if that marker is present. An explicit
# value set here therefore wins over both, which is exactly what the marker exists for.
#
# **Sockets are NOT affected and must not be.** openqha/config.socket_dir() keys off
# S0_SCRATCH, never off the runs root, so the MACE socket stays at
# /tmp/<owner>/<job id>/sockets/ even on this run. A Unix socket is a rendezvous between
# processes on one machine; two jobs sharing one on Lustre is the 2026-09-09 collision.
export S0_RUNS_ROOT="$HOME/runs/openQHA"

# ---- diagnostics: identical to branchA.conf --------------------------------------------
# See branchA.conf for what each one is for. Keeping them the same is the point: the two
# runs must differ in the filesystem and in nothing else.
MAX_CONFORMERS=100
# KEEP_CALCSPACE removed 2026-09-15 (user): the NaN of 2026-09-09 was a weights file, now refused at load;
# the calcspace is thousands of files per molecule and MACE_TRACE is the diagnostic that worked.
# --keep-calcspace DIR is still accepted by s0_A_pipeline.py for a run you are watching.

# A PATH rather than 1, so the trace is written straight onto the filesystem and does not
# depend on the end-of-job copy-back. On this run that copy-back has nothing to carry
# anyway -- only the sockets are node-local.
MACE_TRACE=$S0_RUNS_ROOT/trace_02a_1

# Not used by this chain, but read by run_chain.sh before it dispatches.
SEEDS=1        # one per basin (ruling 2026-09-13); 2+ = blank control
