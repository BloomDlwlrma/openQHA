# Branch A ONLY, on the CPU cluster. Acetone.
#
#     bash examples/run_chain.sh examples/02a_qha_openmm_acetone/branchA.conf deimos
#
#     bash examples/run_chain.sh examples/02a_qha_openmm_acetone/branchA.conf debug   # 30-minute queue first
#
#     bash examples/run_chain.sh examples/02a_qha_openmm_acetone/branchA.conf   # here
#
# =======================================================================================
# WHY A SEPARATE CONF AND NOT `CHAIN=conformers` ON THE COMMAND LINE
# =======================================================================================
# The job re-sources this file on the compute node and never sees the shell that
# submitted it -- that is the point of not using `--export`. So a CHAIN set in the
# environment would steer the dispatch on the login node and then be forgotten once the
# job started: it would report one chain and run another. `run_chain.sh` refuses that
# combination outright. The chain is a property of the run, so it lives in the file that
# describes the run.
# =======================================================================================

CHAIN=conformers

SPECIES=dsgdb9nsd_000018        # acetone, CC(=O)C, 10 atoms, sigma 2
TAG=acetone

# 4 threads is the condition the 285 s/species figure was measured under, so a run at
# this setting is comparable with the record. It uses 4 of the node's cores and leaves
# the rest idle -- correct for ONE species, wasteful for a campaign. For many species use
# the branch A Parsl driver, which is what the 16 workers x 4 threads layout in
# hpc/resource_configs/tianhe_cpu.py exists for:
#
#     python scripts/production/s0_E_branchA_parsl.py --resource tianhe_cpu --tag <tag>
THREADS=4

# =======================================================================================
# DIAGNOSTICS -- on for acetone, and only for acetone
# =======================================================================================
# Job 7347197 (2026-09-09, propanal, deimos) finished CREST cleanly, reported
# **1814 conformers, every energy NaN**, and left nothing behind that could explain why:
# the external gradient client writes its errors into CREST's calcspace, and CREST
# removes the calcspace. So this run is instrumented at both ends of the socket and keeps
# everything it writes. It is a run to WATCH, not a template for a campaign.

# The ceiling for THIS molecule. Acetone is CC(=O)C: one C-C-C-O torsion and two methyl
# rotors, so the conformer count is single digits -- the shipped reference for this exact
# species is **7** (configs/conformers.yaml section 1.7, verified 2026-08-30).
# 100 is therefore not a tight bound but a **cliff**: nothing between 7 and 100 is
# plausible, and anything above it means the ranking has stopped working, exactly as it
# did at 1814. Deliberately NOT a default in s0_A_pipeline.py -- the number is a fact
# about acetone, not about the pipeline, and a guessed default applied to a flexible
# molecule would abort a correct run.
MAX_CONFORMERS=100

# Keep CREST's external-calculator directory instead of letting CREST delete it. This is
# where `genericinp.xyz` is written, where `genericinp.engrad` is expected back, and where
# the client's stderr lands in `generic.out` -- the three files that would have answered
# the question the first time. Relative to the CREST working directory.
# KEEP_CALCSPACE removed 2026-09-15 (user): the NaN of 2026-09-09 was a weights file, now refused at load;
# the calcspace is thousands of files per molecule and MACE_TRACE is the diagnostic that worked.
# --keep-calcspace DIR is still accepted by s0_A_pipeline.py for a run you are watching.

# One line per gradient from the client AND from the server. The client's trace is
# written OUTSIDE the calcspace so it survives regardless. The decisive comparison:
# the server's own "N gradients in all" against `Total number of energy+grad calls` in
# crest.out. Equal means the gradients were computed and the answers did not get back;
# zero means nothing ever reached the server.
MACE_TRACE=1

# Everything above writes into the node-local tree under /tmp/<owner>/<job id>/, which
# `chain_body.sh` copies to `logs/node_local/<jobid>/` when the job ends. That is the
# whole point: on this run, I/O cost is not a consideration and nothing is thrown away.

# Not used by this chain, but read by run_chain.sh before it dispatches. Left at the
# defaults so this file can be diffed against chain.conf without noise.
SEEDS=1        # one per basin; 2+ = blank control
