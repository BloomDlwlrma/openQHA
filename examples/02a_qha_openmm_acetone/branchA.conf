# Branch A ONLY, on the CPU cluster. Acetone.
#
#     bash examples/run_chain.sh examples/02a_qha_openmm_acetone/branchA.conf deimos
#
#     bash examples/run_chain.sh examples/02a_qha_openmm_acetone/branchA.conf debug   # 30-minute queue first
#
#     bash examples/run_chain.sh examples/02a_qha_openmm_acetone/branchA.conf   # here
#
# =======================================================================================
# WHY A SEPARATE CONF AND NOT `CHAIN=conformers` ON THE COMMAND LINE
# =======================================================================================
# The job re-sources this file on the compute node and never sees the shell that
# submitted it -- that is the point of not using `--export`. So a CHAIN set in the
# environment would steer the dispatch on the login node and then be forgotten once the
# job started: it would report one chain and run another. `run_chain.sh` refuses that
# combination outright. The chain is a property of the run, so it lives in the file that
# describes the run.
# =======================================================================================

CHAIN=conformers

SPECIES=dsgdb9nsd_000018        # acetone, CC(=O)C, 10 atoms, sigma 2
TAG=acetone

# 4 threads is the condition the 285 s/species figure was measured under, so a run at
# this setting is comparable with the record. It uses 4 of the node's cores and leaves
# the rest idle -- correct for ONE species, wasteful for a campaign. For many species use
# the branch A Parsl driver, which is what the 16 workers x 4 threads layout in
# hpc/resource_configs/tianhe_cpu.py exists for:
#
#     python scripts/production/s0_E_branchA_parsl.py --resource tianhe_cpu --tag <tag>
THREADS=4

# Not used by this chain, but read by run_chain.sh before it dispatches. Left at the
# defaults so this file can be diffed against chain.conf without noise.
SEEDS=3
