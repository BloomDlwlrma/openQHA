#!/bin/bash
# openQHA whole chain -- acetone (dsgdb9nsd_000018). A ONE-BASIN molecule.
#
#     bash examples/run_chain.sh examples/02a_qha_openmm_acetone/chain.conf
#     bash examples/run_chain.sh examples/02a_qha_openmm_acetone/chain.conf ai
#     bash examples/run_chain.sh examples/02a_qha_openmm_acetone/chain.conf h100x
#
# Sourced by `examples/run_chain.sh` in both modes; the job receives this path as its
# argument and sources it too, so there is no `--export` and what the run used is a file.
#
# =======================================================================================
# WHAT ACETONE IS FOR, AND WHAT IT CANNOT DO
# =======================================================================================
# Branch A, measured 2026-09-07 (251.8 s, 9/9 acceptance criteria):
#
#     CREST reports 3 conformers; + 1 reference geometry = 4 frames in -> 1 basin
#     basin 0   sigma 2   C2v   nu_min 79.70 cm-1   G-Eel 35.5090 kcal/mol
#
# **One basin**, so F_conf = -kT ln sum exp(-dG/kT) is identically zero and says nothing
# about any setting. That is not a defect in the example; it is what the molecule is.
#
# Acetone earns its place for the OTHER half. Its two methyl rotors turn freely at 298 K
# (barrier about 0.8 kcal/mol against kT = 0.59), so it is the sharpest available test of
# basin residence: measured over 30 ps, 28 symmetry-equivalent crossings and ZERO
# conformer changes, with all-atom T*S climbing 5.3884 -> 5.5844 while the heavy-atom
# value did not. That is the contamination the `heavy` atom set exists to avoid, on a
# real molecule.
#
# **For the ensemble, use examples/02b_qha_openmm_propanal** -- 3 basins, F_conf = -0.2354
# kcal/mol from the electronic energies alone.
# =======================================================================================

export SPECIES="${SPECIES:-dsgdb9nsd_000018}"       # acetone, CC(=O)C, 10 atoms, sigma 2
export TAG="${TAG:-acetone}"
export SEEDS="${SEEDS:-1}"          # one per basin; 2+ = blank control
export THREADS="${THREADS:-4}"                      # the condition 285 s/species was measured under

# Length, sampling interval and thermostat live in configs/branchB_protocol.yaml, which
# every route reads. They are deliberately NOT settable per example.

export CHAIN="${CHAIN:-qha}"                     # branch A -> B -> collect -> F_conf
                                                    # branch A alone: use branchA.conf
export MODE="${MODE:-local}"
export PARTITION="${PARTITION:-ai}"                 # hpc only: ai | h100x
export COLLECT_RESOURCE="${COLLECT_RESOURCE:-}"     # empty -> same as the trajectories

# =======================================================================================
# THE ALLOCATION, SIZED TO THE WORK (2026-09-11, revised the same day for the site PDF)
# =======================================================================================
# Branch B here is **1 basin x SEEDS = SEEDS trajectories** (one since 2026-09-13;
# three when the blank control is wanted).
#
# On TianheXY-A's fine-grained environment (`source /APP/u22/ai_x86/toolshs/set-XY-I.sh`
# first; run_chain.sh checks) the unit is the CARD: 1 GPU = 12 CPUs = 120 GB, billed as
# max(gpus, ceil(cpus/12)). So the smallest possible request is one card, and asking for
# 3 CPUs instead of 12 saves nothing. Three workers share the one card; nine CPUs idle.
#
# ONE job carries the driver AND the workers (tianhe_a.py sees SLURM_JOB_ID and runs
# parsl in-allocation). There is no second allocation, so BLOCK_GPUS does not apply.
# Set S0_PARSL_NESTED=1 to get the old behaviour -- the driver submitting its own blocks.
#
# On `h100x` (TianheXY-AI) the same three lines mean the same thing: one card.
export NODES="${NODES:-1}"
export GPUS="${GPUS:-1}"                 # cards. The bill.
export CPUS="${CPUS:-12}"                # what one card brings; same price as 3
export MAX_WORKERS="${MAX_WORKERS:-3}"   # >= basins x SEEDS. More is not faster.
