# Branch A for acetone AND propanal, side by side, in **one** job on **one** node.
# This is run 02a-2 + 02b.
#
#     bash examples/run_chain.sh examples/02ab_pair/branchA-pair.conf deimos
#
# =======================================================================================
# WHY ONE JOB AND NOT TWO
# =======================================================================================
# Two `sbatch` submissions would take two nodes to do work that fits on one. deimos
# allocates by node and requires `--exclusive`, so a job holding a node holds all 64
# cores whether it uses them or not -- and job 7347197 used about **1.8%** of the one it
# held. Two molecules at 4 CREST threads each is 8 cores of real work in a single
# allocation instead of 8 cores across two.
#
# 4 threads per molecule, not 8, and that is measured rather than chosen: CREST's own
# `threads` parallelises independent metadynamics runs and scales well (this project has
# seen c/w = 3.999 on the optimisation stages), while MACE on a ten-atom molecule runs
# 111/90/72/101 ms at 1/2/4/8 threads -- **eight threads is slower than four**. Extra
# cores are worth more to another molecule than to this one.
#
# What this pair also answers, which two separate jobs would not: **two pipelines sharing
# one scratch directory and one node.** Until now the socket name was
# `<socket_dir>/s0_mace_pool_0.sock` and `socket_dir()` is per JOB, so two pipelines
# inside one job would both have opened it and the second would have unlinked the first
# -- the 2026-09-09 collision, one level down. The socket name now carries the pid.
# =======================================================================================

CHAIN=conformers_pair

# ---- the molecules ---------------------------------------------------------------------
#     SPECIES  TAG  THREADS  [extra arguments for THIS molecule only]
#
# Tags are the canonical ones, so these products are the ones 02a's and 02b's GPU chains
# consume. (`acetone_fs` from branchA-fs.conf is a separate diagnostic tag and is not
# touched here.)
#
# **The ceiling is on acetone only, and the asymmetry is the point.** Acetone is CC(=O)C:
# one C-C-C-O torsion and two methyl rotors, verified at 7 conformers, so 100 is a cliff
# nothing legitimate approaches. Propanal has an extra rotatable bond and no verified
# count, and a ceiling guessed for it could abort a correct run. The energy check in
# openqha/conformer_search/crest.py::judge_energies covers both regardless -- it asks
# whether the numbers are well formed, which is a property of the calculation.
PAIR_1="dsgdb9nsd_000018 acetone  4 --max-conformers 100"
PAIR_2="dsgdb9nsd_000035 propanal 4"

# ---- read by run_chain.sh on the login node, before it dispatches -----------------------
# The preflight prints a banner and (for GPU chains) looks for an existing branch A
# product. This chain makes branch A rather than consuming it, so these only name the run.
SPECIES=dsgdb9nsd_000018
TAG=acetone
THREADS=4
SEEDS=1        # one per basin (ruling 2026-09-13); 2+ = blank control

# ---- diagnostics, applied to BOTH molecules ---------------------------------------------
# Both observers, no ceiling -- the ceiling is per molecule and lives in PAIR_1 above.
#
# The two pipelines append to ONE engrad_trace.log. That is deliberate: the writes are
# single short lines with O_APPEND, which is atomic on Linux below PIPE_BUF, and each line
# carries the working directory, so the two molecules stay distinguishable while the
# interleaving itself becomes visible evidence that they really did run concurrently.
KEEP_CALCSPACE=mace_calcspace
MACE_TRACE=1
