# 02d, the 30-minute version: the identity chain on a compute node, by hand.
#
#     source /APP/u22/ai_x86/toolshs/set-XY-I.sh
#     bash hpc/tools/gpu_shell.sh 1 02:00:00
#     conda activate openqha-gpu
#     bash hpc/tools/test30.sh examples/02d_qha_frequency_identity/test30.conf
#
# Production is EQUIL 50 + PROD 500 ps (chain.conf). This is 1 + 5: 6 000 steps per
# trajectory, ~6 min at ~60 ms/step with every seed running at once, plus the CPU-side
# minimisation per basin. The identity analysis then runs on far too few frames -- it
# will say so -- which is fine: this tests that every step runs and writes where it
# should, not the number.
#
# TAG != BASIN_TAG on purpose (see 02b/test30.conf): basins are read from the production
# tag, everything written lands under 02d_t30. Delete analysis/qha/02d_t30/ afterwards.
CHAIN=identity
SPECIES=dsgdb9nsd_000018        # acetone
TAG=02d_t30
BASIN_TAG=02d_prod
EQUIL_PS=1
PROD_PS=5
SAMPLE_EVERY=2
SEEDS=3
NU_CUT=25,50,100,150
THREADS=4
