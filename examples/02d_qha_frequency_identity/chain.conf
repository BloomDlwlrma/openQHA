# 02d at PRODUCTION length -- may nu_k replace omega_i in ZPE, enthalpy and entropy?
#
#     bash examples/run_chain.sh examples/02d_qha_frequency_identity/chain.conf deimos   # CPU
#     source /APP/u22/ai_x86/toolshs/set-XY-I.sh
#     bash examples/run_chain.sh examples/02d_qha_frequency_identity/chain.conf ai       # one card
#
# Sourced by examples/run_chain.sh, in the job, on the compute node. Every line here is
# a science setting; nothing about placement belongs in this file. The job is named from
# these values -- openqha_<SPECIES>_identity_e<EQUIL>_p<PROD>_s<SAMPLE>_x<SEEDS>_nu<CUTS> --
# so two runs with different settings never share a log file name.
#
# **To run a variant, copy this file and change the line** (chain_p1000_s5.conf, say). The
# job sources the FILE on the compute node; a `PROD_PS=1000` exported from your login shell
# is not what it reads, and the job name follows the file. That is deliberate: the run's
# settings are something that can be diffed, not something that depended on which shell
# submitted it.
# =======================================================================================

CHAIN=identity

# =======================================================================================
# THE SETTINGS YOU MAY CHANGE, one per line, with what each one costs and what it was
# measured against. Everything else about the trajectory (timestep 1 fs, T = 298.15 K,
# Nose-Hoover chain at 20 fs coupling) is in configs/branchB_protocol.yaml and is NOT
# overridable from a conf, because two copies of a protocol measure nothing.
# =======================================================================================

# --- 1. SPECIES: which molecule --------------------------------------------------------
# Needs a branch A product under TAG (data/basins/<TAG>/...), made by branchA.conf here.
#     dsgdb9nsd_000018   acetone    1 basin,  sigma 2, free methyl rotors (barrier ~0.8 vs kT 0.59)
#     dsgdb9nsd_000035   propanal   3 basins, sigma 1, a general torsion -- the more informative
SPECIES=dsgdb9nsd_000018
TAG=02d_prod

# --- 2. EQUIL_PS: discarded before sampling starts -------------------------------------
# 50 ps is the protocol's value for a 10-19 atom molecule in vacuum (a solvated protein
# needed 520; this does not). Raising it costs wall clock and changes nothing that has
# been measured; lowering it below ~20 risks the thermostat's transient in the frames.
#     protocol 50        candidates 20 | 50 | 100
EQUIL_PS=50

# --- 3. PROD_PS: the sampled length ----------------------------------------------------
# **Longer is not automatically better here** (branchB_protocol.yaml section 2): the
# estimator assumes ONE Gaussian basin, and acetone's methyl rotors turn freely at 298 K,
# so a long trajectory sweeps the hydrogens round a circle and inflates T*S. The length
# is bounded by BASIN RESIDENCE, which `basin_residence` counts and which is reported
# beside every entropy. Read that before believing a longer run.
#     protocol 500 (range 500-1000)      candidates 500 | 1000 | 1500
#     1500 is OUTSIDE the protocol range: run it only to show the residence effect.
#     cost: linear. Frames = PROD_PS * 1000 / SAMPLE_EVERY (1 fs timestep).
PROD_PS=500

# --- 4. SAMPLE_EVERY: steps between saved frames ---------------------------------------
# The protocol samples every 1000 steps (1.0 ps) for the ENTROPY, and the harmonic-limit
# measurement in stage 1 says why 02d cannot:
#
#     frames      dZPE        dT*S          (exactly harmonic surface, answer known)
#        500    +1.4246     +0.0226        <- 500 ps at 1.0 ps
#      12500    -0.0035     -0.0037
#
# The entropy needs ~1000 frames for 0.01 kcal/mol; the ZPE needs ~12 500. At 2 fs,
# 500 ps is 250 000 frames -- 20x the harmonic-limit need, so undersampling cannot be
# blamed for a residual. The entropy analysis subsamples the same file back to 1.0 ps.
#     candidates 1 | 2 | 5 | 10   (fs, at the 1 fs timestep)
#     1  = 500 000 frames, 120 MB per trajectory, no measured gain over 2
#     2  = 250 000 frames,  60 MB                 <- production
#     5  = 100 000 frames,  24 MB, still 8x the ZPE need
#     10 =  50 000 frames,  12 MB, 4x -- the floor if storage is the constraint
SAMPLE_EVERY=2

# --- 5. SEEDS: independent trajectories per basin --------------------------------------
# ONE since the 2026-09-13 ruling (one trajectory per (molecule, basin), campaign-wide).
# The paragraph below is kept as the argument for more; it no longer sets the default.
# Their job is detecting an UNSTABLE trajectory (seed scatter is invisible on a stable run
# and large on an unstable one), not an error bar: the estimator's own seed spread was
# measured at 0.004-0.04 kcal/mol, far inside the 1 kcal/mol target. 3 is the minimum
# that gives the blank control (acceptance criterion 5). Each seed is one worker; on the
# GPU queue 12 fit on one card, so up to SEEDS x basins = 12 costs nothing extra.
#     candidates 3 | 5
SEEDS=1        # one per basin (ruling 2026-09-13); 2+ = blank control

# --- 6. NU_CUT: the splice frequencies for the hybrid (stage 4) --------------------------
# Reported, not used to decide anything: stage 4 exists to show a per-mode splice cannot
# be built on a real surface, and the sweep is how that is shown. cm^-1, comma-separated.
#     candidates 25,50,100,150 | 50,100,200 | 100
NU_CUT=25,50,100,150

# --- 7. THREADS: CPU threads per worker (CPU queue only) ---------------------------------
# Placement, not science: MACE on a ten-atom molecule runs 111/90/72/101 ms at 1/2/4/8
# threads, so 4. On the GPU queue every worker is single-threaded regardless.
THREADS=4
