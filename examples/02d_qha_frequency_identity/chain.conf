# 02d at PRODUCTION length -- may nu_k replace omega_i in ZPE, enthalpy and entropy?
#
#     bash examples/run_chain.sh examples/02d_qha_frequency_identity/chain.conf ai
#
# Sourced by examples/run_chain.sh, in the job, on the compute node. Every line here is
# a science setting; nothing about placement belongs in this file.
# =======================================================================================

CHAIN=identity

# --- the molecule ----------------------------------------------------------------------
# Acetone. Propanal is the same conf with SPECIES=dsgdb9nsd_000035, and it is the more
# informative of the two because it has three basins and a general torsion.
SPECIES=dsgdb9nsd_000018
TAG=02d_prod
THREADS=4

# --- length: production, from configs/branchB_protocol.yaml -----------------------------
# 500 ps is the bottom of the published range (500-1000 ps) and the value the protocol
# carries. It is NOT shortened here: the whole point of this conf is that the answer be a
# production answer.
EQUIL_PS=50
PROD_PS=500

# --- sampling: DENSE, and this is the one place 02d departs from the protocol -----------
# The protocol samples every 1000 steps (1.0 ps) to filter high-frequency noise out of
# the ENTROPY. Measured in 02d stage 1, on a surface that is exactly harmonic:
#
#     frames      dZPE        dT*S
#        500    +1.4246     +0.0226      <- what 500 ps at 1.0 ps actually gives
#      12500    -0.0035     -0.0037
#
# So at the protocol's own interval the zero-point energy carries a +1.42 kcal/mol
# SAMPLING bias before any physics enters. 12 500 frames at 1.0 ps would be 12.5 ns.
#
# At 2 fs, 500 ps gives 250 000 frames -- 20x more than the harmonic limit needs, which
# leaves no room to argue that a residual deviation is undersampling. The entropy
# analysis subsamples back to 1.0 ps from the same file, so one trajectory answers both
# questions and the two cannot come from different runs.
#
# Cost of the density: 250 000 frames x 10 atoms x 3 x 8 bytes = 60 MB per trajectory.
SAMPLE_EVERY=2

# --- seeds ------------------------------------------------------------------------------
# Three per basin. Their main use is detecting an unstable trajectory (CAD-Li: seed
# scatter is invisible on a stable run and large on an unstable one), not an error bar.
SEEDS=3

# --- the cut sweep ----------------------------------------------------------------------
# Reported, not used to decide anything: stage 4 exists to show that a per-mode splice
# cannot be built on a real surface, and the sweep is how that is shown.
NU_CUT=25,50,100,150
