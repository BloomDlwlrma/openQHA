# STEP 1 of 2 -- branch A only, on the CPU cluster. For 02d.
#
#     bash examples/run_chain.sh examples/02d_qha_frequency_identity/branchA.conf deimos   # step 1, CPU
#     bash examples/run_chain.sh examples/02d_qha_frequency_identity/chain.conf ai   # step 2, GPU
#
# **TAG matches chain.conf's** (`02d_prod`). The basin store is keyed by (species, tag),
# so step 2 finds these basins and skips branch A. A mismatched tag would send step 2
# looking somewhere empty and it would refuse on a GPU partition -- correctly, but for a
# reason that takes a while to see.
#
# 02d has its own tag rather than borrowing 02a's because its branch B trajectories are
# sampled 500x more densely (2 fs, not 1.0 ps) and land under the same tag. Keeping the
# products separate is what stops a 250 000-frame trajectory and a 500-frame one from
# sharing a directory and an interpretation.
#
# Propanal is branchA-propanal.conf beside this file (NOT `SPECIES=... bash ...`: the
# conf's own line overrides the shell when sourced). Run both for the three-basin case.

CHAIN=conformers

SPECIES=dsgdb9nsd_000018        # acetone. Propanal: dsgdb9nsd_000035
TAG=02d_prod

THREADS=4
SEEDS=1        # one per basin; 2+ = blank control
