#!/bin/bash
# Search group: debug_realmole_smoke
# Goal: the same chain, small enough to finish on a workstation, so that the machinery is
#       proved before an allocation is spent on the full grid.
#
# **Nothing here is a result.** 20 ps is below the floor at which this branch will read
# acceptance criteria 1 and 5, and one seed gives no blank control. A 0.4 ps run once
# passed the saturation criterion, and the reason it passed was that it had not begun to
# rise. If a row from this file is ever quoted as a number, that is the mistake.
#
#     bash examples/02_qha_openmm_acetone/run_debug_realmole.sh

export SEARCH_GROUP="debug_realmole_smoke"

export SPECIES="${SPECIES:-dsgdb9nsd_000018}"
export ALL_BASINS="${ALL_BASINS:-1}"
export BRANCH_A_TAG="${BRANCH_A_TAG:-debug_realmole_smoke}"

export PROD_PS_LIST=(10 20)
export INTERVAL_PS_LIST=(0.5 1.0)
export THERMOSTAT_LIST=(nhc_20)
export ANALYSIS_ATOMS_LIST=(all heavy)

export SEEDS="${SEEDS:-1}"
export EQUIL_PS="${EQUIL_PS:-5}"
export TIMESTEP_FS="${TIMESTEP_FS:-1.0}"
export TEMPERATURE_K="${TEMPERATURE_K:-298.15}"
export ROUTE="${ROUTE:-ase}"
export PLATFORM="${PLATFORM:-CPU}"

export RESULT_LOG="${RESULT_LOG:-analysis/qha/debug_realmole_smoke/results.csv}"
export RESULT_COLUMNS="length_ps,interval_ps,thermostat,atoms,n_frames,frames_per_dof,mean_TS_kcal,spread_TS_kcal,n_basins,F_conf_kcal,distinct_crossings,symmetry_crossings,criterion_1,verdict"

export TAG="${TAG:-debug_realmole_smoke}"
export SMOKE="1"
