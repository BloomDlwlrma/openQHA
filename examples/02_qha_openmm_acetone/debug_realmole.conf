#!/bin/bash
# Search group: debug_realmole
# Goal: run the WHOLE openQHA chain on one real molecule (acetone), over a grid of
#       branch B settings, and report the molecule's conformational free energy for each
#       cell -- not a synthetic control, not one basin, not one setting.
#
# Methodology: Cartesian product over the four branch B settings that were in dispute on
# 2026-09-07, evaluated on ALL basins that branch A finds for the molecule. Written in
# the convention of 00_QM9_reaction_eng/hkuhpc/REPT-dNN/search/*.conf: `<NAME>_LIST=(...)`
# arrays are swept, bare `export NAME="${NAME:-default}"` are fixed, and every cell
# appends one row to $RESULT_LOG.
#
# WHY A REAL MOLECULE AND NOT THE HARMONIC CONTROL
# ------------------------------------------------
# `s0_qha_parameter_scan.py --stage estimator` answers the ESTIMATOR question exactly:
# it draws from the closed-form canonical distribution, so bias is known. It is silent on
# the two things that actually decide the settings here:
#
#   * does the real trajectory STAY IN ITS BASIN at that length?  (anharmonic, no closed
#     form, and the reason 1.5 ns was withdrawn)
#   * do the basins REWEIGHT when T*S changes?  The deliverable is not one basin's
#     entropy -- it is -kT ln sum exp(-dG_i/kT) over every basin, and a setting that
#     shifts two basins by the same amount changes no answer at all.
#
# Only a real molecule with all its basins can answer either. That is what this is.
#
# ONE TRAJECTORY PER (BASIN, THERMOSTAT); LENGTH, INTERVAL AND ATOM SET ARE POST HOC
# ----------------------------------------------------------------------------------
# Length is a truncation, interval is a stride, atom set is a mask. All three are read off
# ONE long trajectory. Only the thermostat needs its own run. So the grid below is
# 5 x 3 x 5 x 2 = 150 cells but only (n_basins x 5) trajectories -- which is what makes
# it affordable at all.
#
#     bash examples/02_qha_openmm_acetone/run_debug_realmole.sh                # smoke
#     bash examples/02_qha_openmm_acetone/run_debug_realmole.sh --production   # cluster

export SEARCH_GROUP="debug_realmole"

# ── Which molecule, and which basins ────────────────────────────
# Acetone: 10 atoms, 3N-6 = 24, two methyl rotors of order 3. It is the right debug
# molecule precisely BECAUSE those rotors turn freely at 298 K (barrier ~0.8 kcal/mol
# against kT = 0.59) -- the failure this grid exists to catch is visible in it.
export SPECIES="${SPECIES:-dsgdb9nsd_000018}"
export ALL_BASINS="${ALL_BASINS:-1}"       # 1 = every basin branch A finds, not just 0
export BRANCH_A_TAG="${BRANCH_A_TAG:-debug_realmole}"

# ── Production length, ps ───────────────────────────────────────
# 200 is below this branch's own floor for acceptance criteria 1 and 5 and is included
# ONLY as a failing case: a grid whose every row passes has not tested anything.
export PROD_PS_LIST=(200 500 750 1000 1500)

# ── Sampling interval, ps ───────────────────────────────────────
# Measured on the closed form: the estimator is unbiased across all three, and what
# changes is the seed-to-seed spread (0.041 -> 0.004 kcal/mol from 250 to 3000 frames).
export INTERVAL_PS_LIST=(0.5 1.0 2.0)

# ── Thermostat ──────────────────────────────────────────────────
# The name collision is the point. `nhc_*` is a Nose-Hoover CHAIN coupling TIME in fs;
# `langevin_*` is a friction in ps^-1. The paper's "50 ps^-1" is the second kind; the
# production `collision_frequency = 50/ps` is the first (= 20 fs). Not interchangeable.
export THERMOSTAT_LIST=(nhc_20 langevin_50)  # nhc_100 langevin_1 langevin_5 

# ── Atoms the covariance is built from ──────────────────────────
# NOT two versions of one number: closed-form T*S for acetone is 2.9317 kcal/mol
# all-atom and 0.1383 heavy-only. Both are reported so the CORRECTION -- which is a
# difference between basins, where the X-H terms largely cancel -- can be compared.
export ANALYSIS_ATOMS_LIST=(all heavy)

# ── Fixed (not swept) ───────────────────────────────────────────
export SEEDS="${SEEDS:-3}"                 # 3 is the minimum that gives a blank control
export EQUIL_PS="${EQUIL_PS:-50}"
export TIMESTEP_FS="${TIMESTEP_FS:-1.0}"
export TEMPERATURE_K="${TEMPERATURE_K:-298.15}"
export ROUTE="${ROUTE:-ase}"               # ase | openmm  (openmm needs the GPU env)
export PLATFORM="${PLATFORM:-CPU}"         # openmm route only; CUDA on a card

# ── Result logging ──────────────────────────────────────────────
# One row per (length, interval, thermostat, atoms). The columns are exactly the table
# asked for on 2026-09-07, plus what is needed to know whether the row may be believed.
export RESULT_LOG="${RESULT_LOG:-analysis/qha/debug_realmole/results.csv}"
export RESULT_COLUMNS="length_ps,interval_ps,thermostat,atoms,n_frames,frames_per_dof,mean_TS_kcal,spread_TS_kcal,n_basins,F_conf_kcal,distinct_crossings,symmetry_crossings,criterion_1,verdict"

# ── Where the trajectories go ───────────────────────────────────
export TAG="${TAG:-debug_realmole}"
