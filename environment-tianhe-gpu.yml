# openQHA -- ONE environment for BOTH Tianhe GPU clusters. CUDA 12.3.
#
#     module load anaconda3/2023.09
#     module load CUDA/12.2
#     export CONDA_OVERRIDE_CUDA=12.3      # <- NOT OPTIONAL ON A LOGIN NODE, see below
#     conda env create -f environment-tianhe-gpu.yml
#     conda activate openqha-gpu
#
# ---------------------------------------------------------------------------------------
# CONDA_OVERRIDE_CUDA IS REQUIRED WHEREVER THERE IS NO GPU DRIVER
# ---------------------------------------------------------------------------------------
# conda-forge's CUDA builds depend on the `__cuda` VIRTUAL package, which conda and mamba
# synthesise from the NVIDIA driver they can see. A login node has no card and no driver,
# so `__cuda` is absent and every `*cuda*` build below becomes unsatisfiable. Measured on
# ln302%TianheXY-AI, 2026-09-08:
#
#     pytorch =2.5.1 cuda120* is not installable because it requires
#     └─ __cuda =* *, which is missing on the system.
#
# The override affects SOLVING ONLY -- nothing is faked at runtime -- and it is honest
# here because the compute nodes this environment runs on do have a driver (550.54.15).
# `install_dependency.sh` sets it automatically, reading the value from the
# `cuda-version=` pin below so the two cannot drift apart.
#
# Re-testing this on a workstation that HAS a driver proves nothing: check
# `conda info | grep -A6 "virtual packages"` and confirm `__cuda` is genuinely absent
# first. A truncated read of that output is what made this look unnecessary once (S0-G-67).
#
# or:  bash install_dependency.sh --tianhe-cuda    # TianheXY-AI
#      bash install_dependency.sh --tianhe-a       # TianheXY-A
#
# Both flags now build THIS file. They differ only in which modules they load.
#
# ---------------------------------------------------------------------------------------
# WHY ONE FILE, WHEN THERE ARE TWO CLUSTERS (user ruling 2026-09-07)
# ---------------------------------------------------------------------------------------
# There were two: environment-tianhe-cuda.yml pinned 12.4 for TianheXY-AI and
# environment-tianhe-a-cuda.yml pinned 12.3 for TianheXY-A. Both are now in
# `_superseded/`. The split had exactly one cause, and it is removable:
#
#     TianheXY-A module tree tops out at CUDA/12.3. TianheXY-AI has 12.3 as well.
#
# **12.3 is the version both machines have**, so pinning 12.3 fits both and the second
# file has nothing left to say. Going the other way -- 12.4 everywhere -- does not work:
# `module load CUDA/12.4` fails on A, and worse, a conda CUDA pinned newer than the
# runtime imports perfectly cleanly and dies at the first kernel launch.
#
# **CLOSED 2026-09-08.** This used to say "the one thing to check before the first GPU job
# on TianheXY-AI is that CUDA/12.3 is really in its module tree" -- the earlier listing had
# been recorded elided (`CUDA/11.8 ... CUDA/13.2`), so 12.3 was inside the range but had
# never been read off the screen. A full `module avail` on ln302%TianheXY-AI now shows it
# outright, alongside 11.3/11.7/11.8 and 12.0/12.1/12.2/12.4 and 13.0/13.2:
#
#     CUDA/11.3  CUDA/12.0  CUDA/12.3  CUDA/13.2
#     CUDA/11.7  CUDA/12.1  CUDA/12.4
#     CUDA/11.8  CUDA/12.2  CUDA/13.0
#
# So the pin below is met on TianheXY-AI. Note 12.4 is also present HERE -- do not raise
# the pin to it: TianheXY-A has no 12.4, and matching both machines is what makes this one
# file. Re-check with, if the site ever rebuilds its module tree:
#
#     module avail CUDA 2>&1 | tr ' ' '\n' | grep -i "^CUDA/12"
#
# If it ever goes absent, the fix is one line -- CUDA_VERSION in
# hpc/resource_configs/tianhe_ai.py and the pin below -- not a second file.
#
# ---------------------------------------------------------------------------------------
# NO MPI IN HERE, AND THAT IS WHAT MAKES ONE FILE POSSIBLE
# ---------------------------------------------------------------------------------------
# The earlier files each loaded the openmpi built against their own CUDA, and those two
# module names are the other thing that differed:
#
#     TianheXY-AI   mpi/openmpi/5.0.10-gcc-11.4.0-cuda12.4
#     TianheXY-A    mpi/openmpi/5.0.0-gcc-11.4.0-cuda12.2
#
# **Neither is needed.** MPI buys inter-process collectives across nodes. openQHA runs
# nothing of the kind on a GPU: branch C training is one model per card, and branch B
# OpenMM trajectories are one trajectory per card. Eight independent single-card workers
# on one node communicate through the filesystem and the Parsl worker pool, not through
# MPI (hpc/resource_configs/tianhe_a.py).
#
# So no openmpi is loaded, no mpi4py is installed, and the version skew that forced two
# files does not arise. If a genuine multi-GPU DDP job is ever added, load NCCL -- and
# only then -- from that cluster own matched module:
#
#     TianheXY-AI   nccl/2.23.4-cuda-12.4
#     TianheXY-A    nccl/2.19.3-cuda-12.3
#
# ---------------------------------------------------------------------------------------
# WHAT RUNS HERE
# ---------------------------------------------------------------------------------------
#   branch C   MACE fine-tuning with the PHL loss. Genuinely faster on a GPU.
#   branch B   quasi-harmonic trajectories through OpenMM + openqha/openmm_mace.py,
#              one trajectory per card (user ruling 2026-09-07). That is why openmm,
#              openmm-torch and openmmtools are in this file and were in neither of the
#              two it replaces.
#
#              CAVEAT, recorded rather than buried: this repository only GPU measurement
#              of branch B is D0-C-5, where the same trajectory ran 3.5x SLOWER on the
#              GPU than on the CPU. That was a T400 -- a 2 GB entry-level card -- against
#              an H100 or A100 here, so the number does not transfer. It has also not
#              been re-measured. Take the per-ps cost from the temp-partition smoke test
#              before planning a campaign on it.
#
#   NOT branch A. CREST workhorse is GFN2-xTB and xtb has no GPU path at all. Branch A
#   belongs on TianheXY-C with environment-tianhe.yml.
# ---------------------------------------------------------------------------------------
name: openqha-gpu
channels:
  - conda-forge
  # `channels: [conda-forge]` alone does NOT mean conda-forge only -- conda merges the
  # configured channels, and `anaconda3/2023.09` ships with `defaults` configured.
  # Measured 2026-09-04: without this the solver pulled a `defaults` pytorch into an
  # otherwise conda-forge stack AND hid a real solver conflict behind it.
  - nodefaults
dependencies:
  # ---- match the module ---------------------------------------------------------------
  # Same major.minor as `module load CUDA/12.2`, on both clusters, AND not above the
  # driver's CUDA version. Change them together or neither.
  #
  # Dry run 2026-09-05 with CONDA_OVERRIDE_CUDA=12.3 (kept: it is what was solved then,
  # and the solve is not what was wrong):
  #     cuda-version 12.3   cuda-cudart 12.3.101   pytorch 2.5.1 cuda120_py311
  # The 12.2 solve has NOT been re-measured; the torch build tag is expected to stay
  # cuda120 for the reason immediately below.
  #
  # **The torch build tag reads `cuda120`, not `cuda123`, and that is correct.** CUDA 12
  # has minor-version compatibility: a binary built against 12.0 runs on any 12.x
  # runtime. conda-forge ships no cuda123 build; the pinned `cuda-version` is what
  # governs the runtime. Do not "fix" this by hunting for one.
  #
  # =====================================================================================
  # DRIVER NOTE, CORRECTED 2026-09-12 -- THIS PIN WAS 12.3 AND IT BROKE EVERY TRAJECTORY
  # =====================================================================================
  # What stood here said: "TianheXY-A reports driver 535.104.12, which is a CUDA 12.2
  # driver. Minor version compatibility covers a 12.3 runtime on it. Do not read a driver
  # number as a CUDA ceiling."
  #
  # **Half right, and the missing half is the whole failure.** Minor version compatibility
  # covers CUBINS: a kernel already compiled for sm_80 by a 12.3 toolkit loads on a 12.2
  # driver. That is why PyTorch and MACE ran here perfectly well. It does NOT cover
  # **PTX JIT** -- the driver's JIT compiler cannot read a PTX ISA newer than itself, and
  # NVIDIA's own answer to that is "upgrade the driver", not a compatibility mode.
  #
  # OpenMM's CUDA platform compiles EVERY kernel at run time: nvrtc emits PTX, the driver
  # JITs it. So OpenMM is precisely the case the exception names. Measured 2026-09-12,
  # jobs 96843/96844/96845 on an53: all twelve branch B trajectories, three jobs, died
  # identically at `openmm.Context(...)` --
  #
  #     openmm.OpenMMException: Error loading CUDA module:
  #     CUDA_ERROR_UNSUPPORTED_PTX_VERSION (222)
  #
  # -- each after ~3 minutes of torch import and model tracing.
  #
  # So the driver IS a ceiling, for anything that JITs. 12.2 it is, matching
  # `module load CUDA/12.2` (present on both clusters' module trees) and the driver.
  # `openqha/gpu_preflight.py` now reads nvrtcVersion() and cuDriverGetVersion() and
  # refuses before the load, so this cannot recur silently if the driver moves again.
  #
  # To repair an environment that already has 12.3:
  #     mamba install -n openqha-gpu cuda-version=12.2
  - cuda-version=12.2

  # ---- BLAS: NO PINS HERE, AND THAT IS DELIBERATE ---------------------------------------
  # Everywhere else in this repository the three OpenMP-OpenBLAS pins appear, because
  # conda-forge's `crest` links the pthreads build while CREST itself is OpenMP-parallel,
  # and the mismatch cost 4164 warning lines and 20 s per molecule (measured 2026-09-04).
  #
  # **There is no crest and no xtb in this environment.** They are CPU tools and live in
  # environment-tianhe.yml. The defect the pins prevent cannot occur here, so the pins
  # were being carried over out of habit -- and they were not free:
  #
  #     openmmtools + BLAS pins, no CUDA                       SOLVES
  #     openmmtools + CUDA torch, no BLAS pins                 SOLVES
  #     openmmtools + CUDA torch + cuda-version=12.3 + pins    FAILS
  #     this file as it now stands                             SOLVES
  #
  # (Measured 2026-09-07 by dry run, one variable at a time. The three requirements are
  # each satisfiable in pairs and not as a triple.) `nomkl` is absent for the separate
  # reason that CUDA builds of pytorch depend on MKL, so the two cannot both hold.
  #
  # WHAT DROPPING THEM ACTUALLY CHANGES, stated rather than assumed: the solver then
  # picks `libblas 3.9.0 *_mkl` and links numpy against MKL, where the CPU environments
  # link it against OpenBLAS. That is a real divergence and here is why it is acceptable:
  #
  #   * the quasi-harmonic diagonalisation -- the one place a BLAS could move a number --
  #     runs in the COLLECTION pass, on the CPU cluster, in `openqha`, against OpenBLAS.
  #     It never runs in this environment.
  #   * what numpy does here is array handling around OpenMM and torch, both of which
  #     carry their own kernels either way.
  #   * CUDA builds of pytorch depend on MKL regardless, so MKL is in this environment
  #     whether or not numpy uses it. `nomkl` is unsatisfiable here for the same reason.
  #
  # If a BLAS-threading problem ever does show up on a GPU node, hpc/env/common.sh still
  # exports OPENBLAS_NUM_THREADS=1 -- which is what actually fixed the measured case, the
  # pins merely made it unnecessary.
  #
  # SOLVED VERSIONS -- RE-MEASURED 2026-09-08, libmamba, linux-64, CONDA_OVERRIDE_CUDA=12.3
  # (5 min 30 s including the repodata download. The same file under the CLASSIC solver
  # was still running after 1 h 37 min at 100% CPU on a Tianhe login node -- see S0-G-66.
  # This file is not "slow to solve"; it is slow to solve with the wrong solver.)
  #
  #     python         3.11.16  h5f976f7_2_cpython
  #     cuda-version   12.3     h32bc705_3          cudnn        9.10.2.21 hbcb9cd8_0
  #     pytorch        2.5.1    cuda120_py311h7a71dd8_303
  #     libtorch       2.5.1    cuda120_h6f417b9_303
  #     openmm         8.2.0    py311h5db57db_0
  #     openmm-torch   1.5      cuda120py311hc49b99e_0
  #     openmmtools    0.25.0   pyhd8ed1ab_0        mdanalysis   2.10.0  py311hed34c8f_1
  #     numpy          1.26.4   py311h64a7726_0     scipy        1.13.1  py311h517d4fd_0
  #     pandas         2.3.3    py311hed34c8f_2     pyarrow      18.1.0  py311h38be061_0
  #     h5py           3.16.0   nompi_py311h89df61e_104
  #     ase            3.29.0   pyhd8ed1ab_1        rdkit        2025.09.5 py311h34e1bb8_0
  #     pyyaml         6.0.3    py311h3778330_1     pip          26.2.1  pyh8b19718_0
  #     libblas        3.9.0    37_h5875eb1_mkl     mkl          2024.2.2 ha770c72_17
  #     liblapack      3.9.0    37_h5e43f62_mkl
  #     llvm-openmp    23.1.0   h7148c6a_0          _openmp_mutex 4.5    8_kmp_llvm
  #
  # pip layer, versions checked on PyPI 2026-09-08:
  #     mace-torch 0.3.16   pymsym 0.3.5   parsl 2026.9.7
  # NOTE mace-torch 0.3.17 DOES NOT EXIST on PyPI (releases stop at 0.3.16), although
  # requirements.txt says "measured on 0.3.17" in two places. That claim is not currently
  # reproducible; pin 0.3.16.
  #
  # openmm-torch resolves to a **cuda120** build, matching torch. If that ever comes back
  # as a `cpu` build the environment is silently useless for the thing it exists for --
  # the `=*cuda*` constraint above is what turns that into a solver error instead.
  #
  # NOTE THE NUMPY/TORCH SPLIT ACROSS THE TWO ENVIRONMENTS. Here: numpy 1.26.4, torch
  # 2.5.1. In environment-tianhe.yml: numpy 2.4.6, torch 2.13.0. `cuda-version=12.3` plus
  # openmm-torch pulls this whole side back a generation. Products crossing between the
  # two must go through parquet/HDF5/xyz, never pickle.

  - python=3.11
  # **PINNED, not a lower bound** (2026-09-12) -- but NOT for the reason first written
  # here, and the correction matters more than the pin.
  #
  # What stood here said `mamba install cuda-version=12.2` had re-solved the environment
  # and moved numpy to 2.x. **Measured on the machine the same day: numpy is 1.26.4**,
  # installed from conda, in this environment's own site-packages -- and that install had
  # failed outright (the site proxy was unreachable), so nothing moved at all. The claim
  # was wrong; the pin is kept because a lower bound is still a promise this project
  # cannot make (environment-tianhe.yml installed a broken numpy/pytorch pair from
  # exactly such a bound on 2026-09-10).
  #
  # THE REAL FAILURE IS STILL OPEN. With numpy 1.26.4 present and intact:
  #
  #     Failed to initialize NumPy: module 'numpy._globals' has no attribute
  #     '_signature_descriptor'                       <- at torch import
  #     RuntimeError: Numpy is not available          <- torch.from_numpy()
  #     ImportError: numpy._core.multiarray failed to import
  #
  # `numpy._core` is the NumPy **2** layout, so something in this environment was built
  # against numpy 2 and is being run against 1.26.4.
  #
  # Three things have been ruled out on the machine, in this order, on 2026-09-12:
  #
  #   * a scipy 1.16.1 in ~/.local shadowing the environment -- removed, and
  #     PYTHONNOUSERSITE=1 proved it was not the cause: the round trip still fails with
  #     every package coming from the environment;
  #   * numpy being the wrong version -- it is 1.26.4, from conda, and
  #     `numpy.core.multiarray` imports;
  #   * **this pin being backwards** -- read straight out of <prefix>/conda-meta on an45:
  #
  #         pytorch       2.5.1    requires  numpy >=1.19,<3
  #         scipy         1.13.1   requires  numpy <2.3; numpy >=1.19,<3
  #         libtorch      2.5.1    requires  (nothing about numpy)
  #         openmm-torch  1.5      requires  (nothing about numpy)
  #
  #     Every one of those is satisfied by 1.26.4, so NO package here declares a numpy
  #     this pin violates, and moving numpy up would not be satisfying any requirement --
  #     it would be another guess. Keep the pin; it is not the fault.
  #
  # **THE FAULT IS NOT A VERSION AT ALL -- IT IS THE FILES.** Measured on an45 the same
  # day, by comparing every path conda recorded against what is on disk:
  #
  #     numpy tree     1404 file(s) declared by conda
  #     UNDECLARED (left by something else): 366
  #         numpy/_expired_attrs_2_0.py, numpy/_array_api_info.py, numpy/_configtool.py,
  #         numpy/lib/_type_check_impl.py, 362 more
  #     MISSING: none
  #
  # Those basenames exist in **no numpy 1.x release**. A numpy 2 was installed over this
  # prefix and conda's 1.26.4 was later put back: conda restored the 1404 files it owns
  # and left 366 numpy-2 files layered on top, importable. `numpy.__version__` reads
  # 1.26.4 because `__init__.py` is conda's, while the module that reaches for
  # `numpy._globals._signature_descriptor` is one of the orphans -- which is why torch's
  # failure looked like a version disagreement for three rounds and was never one.
  #
  # **`--force-reinstall` alone does not fix it**: conda rewrites only the files it owns
  # and has no record of the other 366, so they survive it untouched. The package
  # directory has to be removed first, and the declared tree restored afterwards.
  #
  # **REPAIRED AND VERIFIED ON an45, 2026-09-12.** pip had recorded both installs, so it
  # could undo them -- `site-packages` held BOTH `numpy-1.26.4.dist-info` and
  # `numpy-2.4.6.dist-info`, and two runs of `pip uninstall -y numpy` removed one each,
  # leaving no numpy at all. Then:
  #
  #     mamba install -n openqha-gpu --offline --force-reinstall numpy==1.26.4
  #
  # after which the probe reports `numpy tree  matches the installed package exactly`
  # and `torch <-> numpy  OK (a round trip worked)`.
  #
  # So this pin is no longer unvalidated: **numpy 1.26.4 and pytorch 2.5.1.post303 have
  # now been observed working together on the machine**, which the 2026-09-08 dry run
  # never established. What was broken was never the version -- it was numpy 2.4.6
  # installed over the top of it.
  - numpy=1.26.4
  - scipy>=1.10
  - pyyaml>=6.0
  - pandas>=1.5
  - pyarrow>=10.0
  - h5py>=3.8            # branch C datasets
  - ase>=3.22
  - rdkit>=2023.03

  # The CUDA build. `cuda-version=12.3` above selects it; asking for a *cuda* build here
  # as well turns "the solver quietly handed me the CPU build" into a solver error.
  - pytorch>=2.0=*cuda*

  # ---- branch B on a card (user ruling 2026-09-07) --------------------------------------
  # openmm-torch is what carries openqha/openmm_mace.py traced MACE module into an OpenMM
  # context; the CUDA build is what lets that context use the CUDA platform. openmmtools
  # supplies NoseHooverChainVelocityVerletIntegrator at ITS OWN documented defaults
  # (50/ps, chain 5, MTS 5, YS 5) -- those defaults ARE branch B thermostat, adopted
  # rather than chosen, so the package is not interchangeable with plain OpenMM.
  - openmm>=8.1
  - openmm-torch>=1.4=*cuda*
  - openmmtools>=0.23
  # The independent implementation behind branch B acceptance criterion 2. Mass-weighted
  # and iterable to the mean structure, which is openqha/qha.py protocol exactly.
  - mdanalysis>=2.4

  - pip
  - pip:
      - mace-torch>=0.3.6
      - pymsym>=0.3.5
      - parsl>=2024.01

# NOT IN HERE:
#   openmpi / mpi4py   see the header -- nothing openQHA runs on a GPU needs collectives,
#                      and dropping them is what let two files become one.
#   crest / xtb        CPU tools. They belong in environment-tianhe.yml on TianheXY-C.
#   gromacs, orca      not part of branch B or branch C on a GPU.
#   MACE-OFF weights   NOT downloaded on a login node. See docs/branchA_production.md
#                      section 4 for what that sentence actually asks you to do.
