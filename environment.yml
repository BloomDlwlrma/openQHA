# openQHA -- ONE environment. Python stack, CREST and xtb all in here.
#
#     conda env create -f environment.yml
#     conda activate openqha
#
# ---------------------------------------------------------------------------------------
# THE BLAS PINS ARE NOT COSMETIC. Read this before relaxing them.
#
# conda-forge's `crest` pulls `libopenblas=*=pthreads_*`, and CREST itself is
# OpenMP-parallel. That combination makes OpenBLAS print
#
#     "OpenBLAS Warning : Detect OpenMP Loop and this application may hang.
#      Please rebuild the library with USE_OPENMP=1 option."
#
# on essentially every step. Pinning the `openmp_*` build removes the mismatch at its
# source. `nomkl` and the two `*openblas` pins are there because conda allows exactly one
# BLAS provider per environment: without them the solver hands numpy/scipy MKL, CREST
# still wants the OpenBLAS `libblas`, and the two cannot both win.
#
# MEASURED on this environment, 2026-09-04, dsgdb9nsd_000018 `--gfn2 --noreftopo -T 4`:
#
#     this file (openmp_*), nothing set        18.5 s   745 lines      0 warnings
#     this file (openmp_*), OPENBLAS=1         18.4 s   749 lines      0 warnings
#     old split env (pthreads_*), nothing set  38.0 s  4910 lines   4164 warnings
#     old split env (pthreads_*), OPENBLAS=1   25.1 s   747 lines      0 warnings
#
# Both binaries report the same 2 conformers: this is cost and noise, not a different
# answer. The pin needs NO environment variable, and is still 1.35x faster than the
# pthreads build with the variable set. env_openqha.sh exports OPENBLAS_NUM_THREADS=1
# regardless -- free here, and it is what protects a CREST installed from elsewhere.
#
# This repository used to ship TWO environments to dodge the warning. That decision came
# from a measurement that changed two things at once -- it separated the environments AND
# set the variable -- and credited the whole difference to the separation. The bottom two
# rows above are one binary, one input, one variable: the separation was never doing
# anything. `environment-crest.yml` and its numbers are in `_superseded/`.
# ---------------------------------------------------------------------------------------
name: openqha
channels:
  - conda-forge
  # `channels: [conda-forge]` alone does NOT mean conda-forge only: conda merges
  # whatever the user has configured. Measured 2026-09-04 on a box with `defaults`
  # configured -- the dry run pulled defaults' pytorch 2.3.1 into an otherwise
  # conda-forge stack. Two channels' builds of one C++/CUDA library in one
  # environment is the same class of hazard as two BLAS builds.
  - nodefaults
dependencies:
  # ---- BLAS: OpenMP OpenBLAS everywhere, no MKL. See the note above. -----------------
  # `nodefaults` above is what keeps this (and everything else) on conda-forge.
  # Without it the bare name resolved to defaults 3.0 instead of conda-forge 1.0.
  - nomkl
  - libopenblas=*=openmp*
  - libblas=*=*openblas
  - liblapack=*=*openblas

  - python=3.11
  - numpy>=1.24
  - scipy>=1.10
  - pyyaml>=6.0
  - pandas>=1.5
  - pyarrow>=10.0
  - matplotlib>=3.5
  - h5py>=3.8
  - jupyter
  - nbconvert
  - ase>=3.22
  - rdkit>=2023.03

  # float64 is required, not preferred: geometry optimisation converges to fmax = 1e-4
  # eV/A, and a float32 force call cannot resolve that.
  #
  # CPU build, pinned. Unpinned, conda-forge hands you a CUDA build -- 2 GB of libraries
  # that branches A and B never touch, and both are MEASURED SLOWER on this project's GPU
  # than on its CPU. Branch C training is the one thing that wants CUDA:
  # `install_dependency.sh --tianhe` swaps the build, or drop the `=*=cpu*` yourself.
  - pytorch>=2.0=*cpu*


  # ---- branch B: OpenMM, openmmtools, MDAnalysis. CORE. --------------------------------
  # These are what branch B's production number is made of, and they are in the ONE
  # environment that accepts what the solver requires:
  #
  #     pytorch  2.13.0 -> 2.12.1     numpy   2.4.6 -> 1.26.4
  #     libtorch 2.13.0 -> 2.12.1     pandas  3.0.5 -> 2.3.3
  #
  # THE COST OF THAT WAS MEASURED, NOT ASSUMED, because a different pytorch is a
  # different set of last bits in every MACE force call. Same geometry, same weights,
  # same frames, before and after
  # (scripts/calibration/s0_B_stack_fingerprint.py, analysis/qha/fingerprint_*.json):
  #
  #     energy                       0.000e+00 eV
  #     force rms and max            0.000e+00 eV/A
  #     every Hessian frequency      0.000e+00 cm-1
  #     T*S on 2000 fixed frames     0.000e+00 kcal/mol
  #     every quasi-harmonic freq.   0.000e+00 cm-1
  #
  # Bit-identical. Re-run that fingerprint before and after any future change to this
  # block; a stack change whose cost is unmeasured is a stack change nobody can defend.
  #
  # openmmtools is the one that fixes the thermostat: its
  # NoseHooverChainVelocityVerletIntegrator defaults -- collision_frequency 50/ps (a 20 fs
  # coupling), chain_length 5, num_mts 5, num_yoshidasuzuki 5 -- are what branch B runs,
  # adopted rather than chosen. The same 50 ps^-1 is in the QHA reference paper.
  #
  # MDAnalysis is CORE, not a convenience: it is the independent implementation behind
  # acceptance criterion 2. Fitted mass-weighted and iterated the way openqha/qha.py fits,
  # it agreed to 8.020e-09 kcal/mol on 3125 real frames.
  #
  # NNPOps and openmm-ml are deliberately absent: openqha/openmm_mace.py builds the graph
  # itself, as the complete graph, which is exact for 10-19 atoms.
  - openmm>=8.1
  - openmm-torch>=1.4
  - openmmtools>=0.23
  - mdanalysis>=2.4
  # An EXTENSION, here because it is cheap. It CANNOT mass-weight, so it is never
  # agreement -- it differed from us by 2.41 kcal/mol -- and its float32 solver returned
  # the IDENTITY rotation for 300 of 3125 frames without raising.
  - mdtraj>=1.9

  # ---- the conformer search itself ---------------------------------------------------
  - crest>=3.0.2
  - xtb>=6.6            # the GFN2 workhorse; also branch C's `xtb --hess` labels

  - pip
  - pip:
      # The potential: the mace FORK is not installed here -- it arrives as the sibling
      # `mace/` checkout, and openQHA-Hessian/install.sh installs it (editable) beside
      # the package; the checkout is the install path (2026-10-02 ruling: the fork-by-URL
      # pin retired).
      # the chirality test of the enantiomer degeneracy (rotational vs orthogonal
      # Procrustes, Meng et al. CPC 2022); asserted equal to our Kabsch on every pair
      - qc-procrustes>=1.0
      - pymsym>=0.3.5
      - parsl>=2024.01

# NOT IN HERE, and each for its own reason:
#   gromacs   an EXTENSION since 2026-09-05 -- openqha/extensions/gromacs.py -- and no
#             number depends on it. MDAnalysis above is the routine independent check
#             (8.020e-09 kcal/mol against us, where GROMACS gave 1.27e-04) and needs no
#             external binary. Install GROMACS only for a check by a program that shares
#             no Python with openQHA at all:
#                 conda install -c conda-forge gromacs
#             Its activation hook fails under `set -u`. openqha/extensions/gromacs.py
#             finds it in a sibling conda environment.
#   NNPOps,
#   openmm-ml the usual way to run MACE inside OpenMM. Not needed: see
#             openqha/openmm_mace.py for the measurement that made them unnecessary.
#   orca      registration required, installed by hand; branch C only.
#   MACE-OFF weights   fetched by install_dependency.sh, not shipped and not a package.
#                      openqha/engine.py resolves the file by name at load.
